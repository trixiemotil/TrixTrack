<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ----- THEME TOKENS (default: dark maroon) ----- */
:root {
  --bg:#F5EEE5;
  --surface:#FFFAF2;
  --ink:#35131F;
  --ink-soft:#70515C;
  --ink-faint:#A88D96;
  --primary:#5B0A0A;
  --primary-dark:#3D0606;
  --primary-tint:#F1E3E0;
  --gold:#A97836;
  --gold-tint:#F6EEDC;
  --expense:#B5544A;
  --expense-tint:#F5E4E1;
  --income:#3E7C5A;
  --income-tint:#E4EFE6;
  --border:#DDCFC4;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(74,16,40,0.04), 0 8px 24px rgba(74,16,40,0.08);
}
.theme-pink {
  --bg:#F5EADC;
  --surface:#FFF9F3;
  --ink:#402E2A;
  --ink-soft:#6F5550;
  --ink-faint:#9E817D;
  --primary:#E18498;
  --primary-dark:#B95F76;
  --primary-tint:#FFD7DB;
  --gold:#B98569;
  --gold-tint:#F6E8DC;
  --expense:#B95462;
  --expense-tint:#FBE3E5;
  --income:#638568;
  --income-tint:#E6EEE4;
  --border:#E7CEC5;
}
.theme-yellowbrown {
  --bg:#FFEDA2;
  --surface:#FFF5C9;
  --ink:#3E2723;
  --ink-soft:#634A35;
  --ink-faint:#927A57;
  --primary:#3E2723;
  --primary-dark:#291A17;
  --primary-tint:#F4D875;
  --gold:#A67C25;
  --gold-tint:#F7DF82;
  --expense:#B5544A;
  --expense-tint:#F5E4E1;
  --income:#52764E;
  --income-tint:#E4EBCB;
  --border:#D9BE69;
}
body.dark-mode{color-scheme:dark;--bg:#111013;--surface:#1D191B;--ink:#F7EDE8;--ink-soft:#C7B5B2;--ink-faint:#9A858B;--primary:#B8323D;--primary-dark:#68151B;--primary-tint:#3A1F22;--gold:#D8AD62;--gold-tint:#34291C;--expense:#E9675D;--expense-tint:#39211F;--income:#74C99A;--income-tint:#1F3329;--border:#44383A;--shadow:0 2px 5px rgba(0,0,0,.24),0 12px 28px rgba(0,0,0,.28);}
body.theme-pink.dark-mode{--bg:#241A18;--surface:#342522;--ink:#F5EADC;--ink-soft:#D8C3B9;--ink-faint:#AB9188;--primary:#E18498;--primary-dark:#C76C83;--primary-tint:#4A2C33;--gold:#D5A487;--gold-tint:#3C2B26;--expense:#EF8A93;--expense-tint:#47292E;--income:#8DBB91;--income-tint:#253429;--border:#59413C;}
body.theme-yellowbrown.dark-mode{--bg:#211714;--surface:#34241A;--ink:#FFEDA2;--ink-soft:#E3D08A;--ink-faint:#BCA96C;--primary:#FFEDA2;--primary-dark:#E7D27D;--primary-tint:#463922;--gold:#FFEDA2;--gold-tint:#463922;--expense:#EF8175;--expense-tint:#3A2420;--income:#8EB879;--income-tint:#26331F;--border:#5A472B;}
body.theme-yellowbrown.dark-mode .brand-mark,
body.theme-yellowbrown.dark-mode .nav-item.active,
body.theme-yellowbrown.dark-mode .theme-btn.active,
body.theme-yellowbrown.dark-mode .btn:not(.secondary):not(.ghost):not(.danger),
body.theme-yellowbrown.dark-mode .hero,
body.theme-yellowbrown.dark-mode .wallet-overview,
body.theme-yellowbrown.dark-mode .goal-overview,
body.theme-yellowbrown.dark-mode .wallet-add-icon,
body.theme-yellowbrown.dark-mode .records-manage-icon,
body.theme-yellowbrown.dark-mode .category-icon-option.selected,
body.theme-yellowbrown.dark-mode .goal-icon-option.selected,
body.theme-yellowbrown.dark-mode .date-picker-day.selected,
body.theme-yellowbrown.dark-mode .goal-modal .type-toggle button.active.exp,
body.theme-yellowbrown.dark-mode .goal-modal .type-toggle button.active.inc,
body.theme-yellowbrown.dark-mode .fab,
body.theme-yellowbrown.dark-mode .desktop-fab{color:#3E2723;}
body.theme-yellowbrown.dark-mode .goal-overview,
body.theme-yellowbrown.dark-mode .goal-overview *{color:#3E2723;}
body.theme-yellowbrown.dark-mode .wallet-add-icon{background:#FFEDA2;color:#3E2723;}
body.theme-yellowbrown.dark-mode .wallet-overview,
body.theme-yellowbrown.dark-mode .wallet-overview *{color:#3E2723 !important;}
body.theme-yellowbrown.dark-mode .bottom-nav .fab{width:auto;height:auto;padding:4px 6px;border-radius:0;background:transparent;color:#FFEDA2;box-shadow:none;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  min-height:100dvh;
  transition: background 0.2s, color 0.2s, border 0.2s;
}
h1,h2,h3,.display{
  font-family:'Dancing Script',cursive;
  font-weight:700;
  letter-spacing:0;
  margin:0;
}
.mono{font-family:system-ui,sans-serif; font-variant-numeric:normal;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--primary-tint); color:var(--primary-dark);}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh; min-height:100dvh;}

.sidebar{
  width:220px; flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:24px 16px;
  display:flex; flex-direction:column; gap:4px;
  position:sticky; top:0; height:100vh;
  transition: background 0.2s, border 0.2s;
}
.brand{
  display:flex; align-items:center; gap:8px;
  padding:4px 10px 22px 10px;
}
.brand-mark{
  width:28px;height:28px;border-radius:8px;
  background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  color:#fff;
}
.brand-mark svg{width:22px;height:22px;display:block;}
.brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:18px;}

.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:10px 12px; border-radius:10px;
  color:var(--ink-soft); font-weight:500; font-size:14.5px;
  border:none; background:none; text-align:left; width:100%;
  transition:background .15s ease, color .15s ease;
}
.nav-item svg{flex-shrink:0;}
.nav-item:hover{background:var(--primary-tint); color:var(--primary-dark);}
.nav-item.active{background:var(--primary); color:#fff;}

.sidebar-footer{margin-top:auto; padding:10px; font-size:12px; color:var(--ink-faint);}
.theme-selector{
  display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;
}
.theme-btn{
  padding:4px 10px; border-radius:20px; border:1px solid var(--border);
  background:var(--surface); font-size:11px; font-weight:500; color:var(--ink-soft);
  transition: 0.15s;
}
.theme-btn.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.theme-btn:hover{border-color:var(--primary);}

.main{flex:1; min-width:0; padding:28px 32px 100px 32px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:22px; flex-wrap:wrap; gap:12px;
}
.topbar h1{font-size:34px;}
.topbar .sub{color:var(--ink-soft); font-size:13.5px; margin-top:3px;}

.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:10px 16px; border-radius:10px; border:1px solid transparent;
  font-weight:600; font-size:13.5px;
  background:var(--primary); color:#fff;
}
.btn:hover{background:var(--primary-dark);}
.btn.secondary{background:var(--surface); color:var(--ink); border-color:var(--border);}
.btn.secondary:hover{background:var(--primary-tint); border-color:var(--primary);}
.btn.ghost{background:transparent; color:var(--ink-soft); border:none; padding:6px 8px;}
.btn.ghost:hover{color:var(--ink);}
.btn.danger{background:var(--expense-tint); color:var(--expense);}
.btn.danger:hover{background:var(--expense); color:#fff;}
.btn.small{padding:7px 12px; font-size:12.5px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
  position:relative;
  transition: background 0.2s, border 0.2s;
}
.card.perf::before{
  content:"";
  position:absolute; top:-1px; left:16px; right:16px; height:1px;
  background-image:radial-gradient(circle, var(--bg) 2.2px, transparent 2.3px);
  background-size:12px 12px; background-repeat:repeat-x;
}
.grid{display:grid; gap:16px;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}

.hero{
  background:linear-gradient(135deg, var(--primary-dark), var(--primary));
  border-radius:var(--radius); color:#fff; padding:26px 28px;
  display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:18px;
  margin-bottom:18px;
}
.hero .label{font-size:12.5px; text-transform:uppercase; letter-spacing:.09em; opacity:.75; margin-bottom:6px;}
.hero .amount{font-family:'Fraunces',serif; font-size:42px; font-weight:600;}
.hero-stats{display:flex; gap:22px;}
.hero-stat{font-size:13px; opacity:.9;}
.hero-stat .v{font-family:system-ui,sans-serif; font-weight:600; font-size:15px; display:block; margin-top:2px;}
.dashboard-goals{margin:20px 0 7px;}
.dashboard-goals .section-head{margin-bottom:12px;}
.dashboard-goals .section-head h3{font-size:21px;}
.dashboard-goal-track{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--border-strong,var(--border)) transparent;}
.dashboard-goal-card{flex:0 0 clamp(205px,68%,250px);min-height:104px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:11px 12px;border:1px solid var(--border);border-radius:15px;background:linear-gradient(145deg,var(--surface),var(--bg));color:var(--ink);text-align:left;box-shadow:0 4px 13px rgba(62,37,30,.04);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;}
.dashboard-goal-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--primary) 38%,var(--border));box-shadow:0 9px 22px rgba(62,37,30,.09);}
.dashboard-goal-card-head{display:flex;align-items:center;gap:8px;min-width:0;}
.dashboard-goal-card .goal-icon-preview{width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--goal-color,var(--primary)) 12%,var(--surface));color:var(--goal-color,var(--primary));}
.dashboard-goal-card .goal-icon-preview svg{width:18px;height:18px;}
.dashboard-goal-card-name{flex:1;min-width:0;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dashboard-goal-card-pct{font:600 14px system-ui,sans-serif;color:var(--primary);}
.dashboard-goal-progress{height:5px;border-radius:99px;background:color-mix(in srgb,var(--goal-color,var(--primary)) 13%,var(--surface));overflow:hidden;}
.dashboard-goal-progress span{display:block;height:100%;border-radius:inherit;background:var(--goal-color,var(--primary));}
.dashboard-goal-card-foot{display:flex;justify-content:space-between;gap:8px;color:var(--ink-faint);font-size:9.5px;}
.dashboard-goal-card-foot strong{color:var(--ink-soft);font:600 9.5px system-ui,sans-serif;}
.dashboard-goal-empty{min-height:90px;display:flex;align-items:center;gap:12px;padding:16px;border:1px dashed var(--border-strong,var(--border));border-radius:16px;color:var(--ink-soft);font-size:13px;}
.dashboard-goal-empty button{margin-left:auto;border:0;background:none;color:var(--primary);font-weight:700;white-space:nowrap;}
.dashboard-recent{margin-top:0;margin-bottom:14px;}
.dashboard-recent .section-head{margin:0 0 8px;}
.dashboard-recent-list{padding:3px 13px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:0 4px 14px rgba(62,37,30,.035);}
.dashboard-recent-list .receipt-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;grid-template-areas:"icon details amount" "icon details actions";align-items:center;gap:3px 10px;padding:12px 1px;border-bottom:1px solid var(--border);}
.dashboard-recent-list .receipt-icon{grid-area:icon;width:36px;height:36px;border-radius:12px;}
.dashboard-recent-list .receipt-icon svg{width:18px;height:18px;}
.dashboard-recent-list .receipt-mid{grid-area:details;}
.dashboard-recent-list .receipt-cat{font-size:12.5px;}
.dashboard-recent-list .receipt-meta{font-size:10.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dashboard-recent-list .receipt-leader{display:none;}
.dashboard-recent-list .receipt-amt{grid-area:amount;font-size:12px;}
.dashboard-recent-list .receipt-actions{grid-area:actions;justify-self:end;opacity:1;}
.dashboard-recent-list .receipt-actions .btn.ghost{width:25px;height:25px;padding:5px;}
.dashboard-recent-empty{padding:24px 12px;border:1px dashed var(--border);border-radius:15px;color:var(--ink-faint);font-size:13px;text-align:center;}

.stat-card{padding:18px 20px;}
.stat-card .k{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.07em;}
.stat-card .v{font-family:system-ui,sans-serif; font-size:22px; font-weight:600; margin-top:6px;}
.stat-card.income .v{color:var(--income);}
.stat-card.expense .v{color:var(--expense);}

.section{margin-bottom:26px;}
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.section-head h3{font-size:21px;}
.section-head .link{font-size:12.5px; color:var(--primary); font-weight:600; background:none; border:none;}

.wallet-card{
  padding:16px; display:flex; flex-direction:column; gap:0; cursor:pointer;min-width:0;
  border-width:1px;
}
.wallet-card .top{display:flex; align-items:center; gap:10px;}
.wallet-icon{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:10px;font-weight:700;letter-spacing:-.03em;}
.wallet-icon svg{width:19px;height:19px;}
.wallet-icon.cash{background:#DDF2D4;color:#356B3D;}
.wallet-icon.bank{background:#6B584A;}
.wallet-icon.other{background:#8C6F86;}
.wallet-icon.card{background:#54718A;}
.wallet-icon.wallet{background:#AD7542;}
.wallet-icon.savings{background:#56806A;}
.wallet-icon.gcash{background:#007DFE;font-size:17px;}
.wallet-icon.bpi{background:#D72C39;font-size:9px;}
.wallet-icon.bdo{background:#063E77;font-size:9px;}
.wallet-icon.gotyme{background:#008E79;font-size:11px;}
.wallet-icon.paypal{background:#003087;font-size:17px;font-style:italic;}
.wallet-icon.atome{background:#E9F548;overflow:hidden;}
.wallet-icon.tiktok-paylater{background:#111;color:#fff;font-size:15px;}
.wallet-icon.shopee-paylater{background:#EE4D2D;color:#fff;font-size:15px;}
.wallet-icon.metrobank{background:#0063A8;}
.wallet-icon.unionbank{background:#D1222A;}
.wallet-icon.landbank{background:#007A53;}
.wallet-icon.pnb{background:#0066A4;}
.wallet-icon.securitybank{background:#B31E2D;}
.wallet-icon.rcbc{background:#7B1E3A;}
.wallet-icon.chinabank{background:#B9202E;}
.wallet-icon.eastwest{background:#00529B;}
.wallet-logo{display:block;object-fit:contain;}
.wallet-logo.gotyme{width:29px;height:15px;}
.wallet-logo.atome{width:100%;height:100%;object-fit:cover;}
.wallet-icon-preview{width:42px;height:42px;}
.wallet-modal{width:min(100%,480px);max-height:min(90dvh,780px);height:auto;padding:0;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;}
.wallet-modal .modal-head{position:relative;top:auto;flex:none;margin:0;padding:20px 20px 14px;border-bottom:1px solid var(--border);}
.wallet-modal .modal-head h3{font-size:23px;}
.wallet-modal-intro{flex:none;margin:0;padding:11px 20px 14px;border-bottom:1px solid color-mix(in srgb,var(--border) 62%,transparent);color:var(--ink-soft);font-size:13px;line-height:1.5;}
.wallet-modal form{display:flex;flex:1;flex-direction:column;min-height:0;overflow:hidden;}
.wallet-modal-fields{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 0;overscroll-behavior:contain;}
.wallet-modal .field{margin-bottom:16px;}
.wallet-modal .field label{font-size:13px;margin-bottom:8px;}
.wallet-modal .field input{min-height:48px;border-radius:12px;background:var(--bg);}
.wallet-modal-preview{display:flex;align-items:center;gap:12px;margin-bottom:17px;padding:13px;border:1px solid color-mix(in srgb,var(--primary) 20%,var(--border));border-radius:15px;background:linear-gradient(140deg,var(--surface),var(--bg));}
.wallet-modal-preview .wallet-icon{width:44px;height:44px;border-radius:14px;}
.wallet-modal-preview-copy{display:grid;gap:3px;min-width:0;}
.wallet-modal-preview-copy small{color:var(--ink-faint);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.wallet-modal-preview-copy strong{overflow:hidden;font-size:14px;text-overflow:ellipsis;white-space:nowrap;}
.wallet-modal-preview-copy span{color:var(--ink-soft);font-size:11px;}
.wallet-modal-trigger{width:100%;min-height:58px;display:flex;align-items:center;gap:11px;padding:8px 11px;border:1px solid var(--border);border-radius:13px;background:var(--surface);color:var(--ink);text-align:left;transition:border-color .15s ease,box-shadow .15s ease;}
.wallet-modal-trigger:hover{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 8%,transparent);}
.wallet-modal-trigger .wallet-icon{width:40px;height:40px;border-radius:12px;}
.wallet-modal-trigger-copy{min-width:0;flex:1;}
.wallet-modal-trigger-copy strong,.wallet-modal-trigger-copy small{display:block;}
.wallet-modal-trigger-copy strong{font-size:13px;}
.wallet-modal-trigger-copy small{margin-top:3px;color:var(--ink-faint);font-size:11px;}
.wallet-modal-chevron{width:17px;height:17px;flex:none;color:var(--ink-faint);}
.wallet-modal-footer{flex:none;padding:13px 20px 19px;border-top:1px solid var(--border);background:var(--surface);}
.wallet-modal-footer .modal-actions{margin:0;}
.wallet-modal-footer .modal-actions .btn{min-height:46px;justify-content:center;}
.wallet-delete-action{display:block;margin:10px auto 0;padding:5px 10px;border:0;background:transparent;color:var(--expense);font-size:12px;font-weight:600;}
.wallet-delete-action:hover{text-decoration:underline;}
.wallet-choice-modal{width:min(100%,440px);height:auto;max-height:min(82dvh,680px);padding:0;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;}
.wallet-choice-modal .modal-head{position:relative;top:auto;flex:none;margin:0;padding:20px 20px 14px;border-bottom:1px solid var(--border);}
.wallet-choice-modal .modal-head h3{font-size:22px;}
.wallet-choice-intro{flex:none;padding:11px 20px 14px;color:var(--ink-soft);font-size:13px;line-height:1.5;}
.wallet-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;overflow:auto;padding:0 20px 20px;overscroll-behavior:contain;}
.wallet-choice-option{position:relative;min-width:0;min-height:67px;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:13px;background:var(--surface);color:var(--ink);text-align:left;transition:border-color .15s ease,background .15s ease,transform .15s ease;}
.wallet-choice-option:hover{transform:translateY(-1px);border-color:var(--primary);}
.wallet-choice-option.selected{border-color:var(--primary);background:var(--primary-tint);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 8%,transparent);}
.wallet-choice-option .wallet-icon{width:38px;height:38px;border-radius:12px;flex:none;}
.wallet-choice-option-name{min-width:0;overflow:hidden;font-size:12.5px;font-weight:600;text-overflow:ellipsis;white-space:nowrap;}
.wallet-choice-option-check{position:absolute;top:6px;right:7px;color:var(--primary);font-size:12px;font-weight:700;}
.wallet-card .name{font-weight:600; font-size:14px;}
.wallet-card .bal{font-family:system-ui,sans-serif; font-size:19px; font-weight:600;}
.atome-limit-breakdown{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:12px;width:100%;}
.atome-limit-breakdown>span{box-sizing:border-box;width:100%;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 10px;border:0;border-radius:10px;background:var(--bg);}
.atome-limit-breakdown small{font-size:10px;color:var(--ink-faint);}

.goals-grid{align-items:start;}
.goal-card{padding:19px 20px;border-radius:18px;}

.goal-card-actions .btn.ghost:hover{background:var(--primary-tint);color:var(--primary);}
.goal-name{font-weight:600; font-size:15px;}
.goal-deadline{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
.progress-track{height:8px; border-radius:5px; background:var(--gold-tint); overflow:hidden; margin:10px 0 8px 0;}
.progress-fill{height:100%; background:var(--gold); border-radius:5px; transition:width .3s ease;}
.goal-nums{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft);}
.goal-nums .cur{font-family:system-ui,sans-serif; font-weight:600; color:var(--ink);}

.cat-chip{
  display:inline-flex; align-items:center; gap:7px;
  padding:7px 12px; border-radius:999px; border:1px solid var(--border);

}

.cat-chip .x:hover{color:var(--expense);}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--border);
  background:var(--bg); font-size:14px; color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--primary); outline-offset:0; background:var(--surface);}
.field-row{display:flex; gap:12px;}
.field-row .field{flex:1;}
.type-toggle{display:flex; border:1px solid var(--border); border-radius:9px; overflow:hidden;}
.type-toggle button{flex:1; padding:9px; border:none; background:var(--surface); font-weight:600; font-size:13px; color:var(--ink-soft);}
.type-toggle button.active.exp{background:var(--expense); color:#fff;}
.type-toggle button.active.inc{background:var(--income); color:#fff;}
.transaction-modal{display:flex;flex-direction:column;width:min(100%,480px);max-height:min(88dvh,760px);padding:22px;border-radius:22px;overscroll-behavior:contain;}
.transaction-modal .modal-head{padding-bottom:13px;margin-bottom:17px;border-bottom:1px solid var(--border);}
.transaction-modal .modal-head h3{font-size:23px;}
.transaction-modal .type-toggle{gap:4px;padding:4px;margin-bottom:20px!important;border:1px solid var(--border);border-radius:14px;background:var(--bg);}
.transaction-modal .type-toggle button{min-height:42px;border-radius:10px;background:transparent;transition:background .16s ease,color .16s ease,box-shadow .16s ease;}
.transaction-modal .type-toggle button.active.exp{background:var(--expense);color:#fff;box-shadow:0 3px 8px color-mix(in srgb,var(--expense) 24%,transparent);}
.transaction-modal .type-toggle button.active.inc{background:var(--income);color:#fff;box-shadow:0 3px 8px color-mix(in srgb,var(--income) 24%,transparent);}
.transaction-modal .transaction-amount-field input{min-height:58px;padding:13px 15px;font:600 23px system-ui,sans-serif;letter-spacing:-.04em;background:linear-gradient(135deg,var(--bg),var(--surface));}
.transaction-modal{border:1px solid color-mix(in srgb,var(--primary) 10%,var(--border));box-shadow:0 24px 72px rgba(53,24,24,.22);}
.transaction-modal .modal-head{margin-bottom:16px;}
.transaction-modal .modal-head h3{font-size:25px;letter-spacing:-.025em;}
.transaction-modal .field{margin-bottom:16px;}
.transaction-modal .field>label{font-size:12px;letter-spacing:.015em;margin-bottom:7px;}
.transaction-modal .field input,.transaction-modal .field select{min-height:46px;border-radius:12px;background:linear-gradient(135deg,var(--bg),var(--surface));}
.transaction-modal .transaction-amount-field input{min-height:62px;border-radius:15px;}
.transaction-modal .field-row{gap:12px;}
.transaction-modal .field-row .field{min-width:0;}
.transaction-modal .field-row input,.transaction-modal .field-row select{min-width:0;}
.transaction-modal .type-toggle{margin-bottom:18px!important;}
.transaction-category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:1px 0 8px;}
.transaction-category-option{min-width:0;min-height:64px;display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:13px;background:var(--surface);color:var(--ink-soft);text-align:left;transition:background .16s ease,border-color .16s ease,transform .16s ease;}
.transaction-category-option:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 45%,var(--border));}
.transaction-category-option.selected{background:var(--primary-tint);border-color:color-mix(in srgb,var(--primary) 48%,var(--border));color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 8%,transparent);}
.transaction-category-option .category-icon{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:color-mix(in srgb,var(--category-color,var(--primary)) 13%,var(--surface));color:var(--category-color,var(--primary));display:grid;place-items:center;}
.transaction-category-option .category-icon svg{width:17px;height:17px;}
.transaction-category-name{min-width:0;font-size:11px;line-height:1.25;font-weight:650;overflow-wrap:anywhere;}
.transaction-category-manage{display:inline-flex;align-items:center;gap:6px;margin:2px 0 0;padding:4px 0;border:0;background:none;color:var(--primary);font-size:12px;font-weight:650;}
.transaction-category-manage:hover{text-decoration:underline;}
.tx-wallet-picker,.tx-category-picker{position:relative;}
.tx-wallet-trigger,.tx-category-trigger{width:100%;min-height:58px;display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(135deg,var(--bg),var(--surface));color:var(--ink);text-align:left;transition:border-color .16s ease,box-shadow .16s ease;}
.tx-wallet-trigger:hover,.tx-category-trigger:hover,.tx-wallet-picker.open .tx-wallet-trigger,.tx-category-picker.open .tx-category-trigger{border-color:color-mix(in srgb,var(--primary) 48%,var(--border));box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 8%,transparent);}
.tx-wallet-trigger-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:12px;background:var(--primary-tint);color:var(--primary);}
.tx-wallet-trigger-icon .wallet-icon{width:38px;height:38px;border-radius:12px;}
.tx-wallet-trigger-copy,.tx-category-trigger-copy{flex:1;min-width:0;display:grid;gap:3px;}
.tx-wallet-trigger-copy strong,.tx-category-trigger-copy strong{font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tx-wallet-trigger-copy small,.tx-category-trigger-copy small{font-size:11px;color:var(--ink-faint);}
.tx-wallet-trigger-copy small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:system-ui,sans-serif;}
.tx-picker-chevron{flex:0 0 auto;color:var(--ink-faint);font-size:18px;transition:transform .16s ease;}
.tx-wallet-picker.open .tx-picker-chevron,.tx-category-picker.open .tx-picker-chevron{transform:rotate(180deg);}
.tx-wallet-options,.tx-category-options{display:none;max-height:250px;overflow-y:auto;overscroll-behavior:contain;margin-top:8px;padding:6px;border:1px solid var(--border);border-radius:15px;background:var(--surface);box-shadow:0 12px 28px rgba(45,26,24,.12);}
.tx-wallet-picker.open .tx-wallet-options,.tx-category-picker.open .tx-category-options{display:grid;gap:5px;}
.tx-wallet-options{position:absolute;z-index:35;top:100%;left:0;width:min(360px,calc(100vw - 76px));}
.tx-wallet-option{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--ink);text-align:left;}
.tx-wallet-option:hover{background:var(--bg);}
.tx-wallet-option.selected{border-color:color-mix(in srgb,var(--primary) 35%,var(--border));background:var(--primary-tint);}
.tx-wallet-option .wallet-icon{width:36px;height:36px;border-radius:11px;}
.tx-wallet-option-copy{flex:1;min-width:0;display:grid;gap:5px;}
.tx-wallet-option-copy strong{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tx-wallet-option-balances{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}
.tx-wallet-option-balances span{min-width:0;display:grid;gap:2px;padding:5px 6px;border-radius:8px;background:color-mix(in srgb,var(--bg) 82%,var(--surface));}
.tx-wallet-option-balances small{font-size:9px;color:var(--ink-faint);}
.tx-wallet-option-balances strong{font:600 10px system-ui,sans-serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tx-picker-check{color:var(--primary);font-size:14px;font-weight:700;}
.tx-category-trigger-icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:11px;background:color-mix(in srgb,var(--category-color,var(--primary)) 13%,var(--surface));color:var(--category-color,var(--primary));}
.tx-category-trigger-icon svg{width:19px;height:19px;}
.tx-category-options{grid-template-columns:repeat(2,minmax(0,1fr));}
.tx-category-options .transaction-category-grid{display:contents;}
.tx-category-options .transaction-category-option{min-height:54px;padding:7px;border-radius:11px;}
.tx-category-options .transaction-category-option .category-icon{width:30px;height:30px;flex-basis:30px;}
.tx-category-options .transaction-category-name{font-size:10.5px;}
.transaction-category-field>label{display:block;margin-bottom:7px;}
/* Keep native date controls within the modal's content width, including Safari's
   intrinsic date-field sizing on iPhone. */
.modal input[type="date"]{display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;}
.modal input[type="date"]::-webkit-date-and-time-value{min-width:0;text-align:left;}
.transaction-modal .modal-actions{position:sticky;bottom:-24px;flex:none;margin:8px -24px -24px;padding:14px 24px max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--surface);}
.transaction-modal .modal-actions .btn{min-height:46px;border-radius:13px;}
@media(max-width:420px){.transaction-modal{padding:18px;border-radius:20px;max-height:calc(100dvh - 24px);}.transaction-modal .modal-head h3{font-size:22px;}.transaction-modal .field-row{display:grid;grid-template-columns:minmax(0,1fr);gap:0;}.transaction-modal .transaction-amount-field input{font-size:21px;}.transaction-modal .modal-actions{bottom:-18px;margin-right:-18px;margin-left:-18px;margin-bottom:-18px;padding-right:18px;padding-left:18px;}.transaction-category-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}.transaction-category-option{min-height:58px;padding:7px;}.tx-wallet-trigger{gap:7px;padding:8px;}.tx-wallet-trigger-icon,.tx-wallet-trigger-icon .wallet-icon{width:32px;height:32px;flex-basis:32px;border-radius:10px;}.tx-wallet-trigger-copy strong{font-size:12px;}.tx-wallet-trigger-copy small{font-size:9px;}}
@media(max-width:600px){
  .transaction-modal{width:calc(100vw - 24px);max-width:480px;max-height:calc(100dvh - 24px);min-width:0;}
  .transaction-modal form,.transaction-modal .field,.transaction-modal .field-row,.transaction-modal .tx-wallet-picker,.transaction-modal .tx-category-picker{width:100%;min-width:0;max-width:100%;}
  .transaction-modal .field input[type="date"]{width:100%;min-width:0;max-width:100%;min-height:48px;padding:10px 9px;font-size:16px;}
  .goal-dates-row{grid-template-columns:minmax(0,1fr);gap:0;}
  .goal-dates-row label{white-space:normal;}
  .goal-dates-row input[type="date"]{min-height:48px;padding:10px 9px;font-size:16px;}
}

.overlay{
  position:fixed; inset:0; background:rgba(58,44,36,0.45); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; overflow-y:auto; overscroll-behavior:contain;
}
.modal{
  background:var(--surface); border-radius:var(--radius); width:100%; max-width:520px;
  max-height:90vh; overflow-y:auto; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,0.25);

.settings-modal .modal-head h3{font-size:25px;letter-spacing:-.025em;}

.categories-page-content{max-width:980px;margin:0 auto;}
.categories-page-enter{animation:categories-page-in .24s cubic-bezier(.2,.75,.25,1) both;}
.categories-page-exit{animation:categories-page-out .16s ease-in both;pointer-events:none;}
@keyframes categories-page-in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@keyframes categories-page-out{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-10px)}}
.categories-page-title-row{align-items:flex-end;}
.categories-page-title-row .sub{max-width:440px;line-height:1.5;font-size:14px;color:var(--ink-soft);}
.categories-page-title-row>.btn{min-height:44px;padding:0 16px;gap:9px;box-shadow:0 5px 14px color-mix(in srgb,var(--primary) 15%,transparent);}
.categories-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start;}
.category-group{min-width:0;}
.category-group-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 2px 10px;}
.category-group-copy{display:flex;align-items:flex-start;gap:10px;min-width:0;}
.category-group-mark{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:11px;background:var(--primary-tint);color:var(--primary);}
.category-group-mark svg{width:17px;height:17px;}
.category-group.expense .category-group-mark{background:var(--expense-tint);color:var(--expense);}
.category-group.income .category-group-mark{background:var(--income-tint);color:var(--income);}
.category-group-title{font:600 15px Inter,sans-serif;color:var(--ink);margin:1px 0 3px;}
.category-group-note{font-size:12px;line-height:1.45;color:var(--ink-faint);}
.category-count{flex:none;padding:5px 9px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font:600 12px system-ui,sans-serif;color:var(--ink-soft);}
.category-list{display:flex;flex-direction:column;gap:8px;padding:12px!important;}
.category-row{display:flex;align-items:center;gap:10px;min-height:52px;padding:7px 8px 7px 10px;border:1px solid var(--border);border-radius:13px;background:var(--surface);transition:border-color .16s ease,transform .16s ease,box-shadow .16s ease;}
.category-row:hover{border-color:color-mix(in srgb,var(--primary) 35%,var(--border));transform:translateY(-1px);box-shadow:0 4px 12px rgba(53,19,31,.05);}
.category-icon{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--primary-tint);color:var(--primary);}
.category-icon svg{width:19px;height:19px;}
.category-row-name{min-width:0;flex:1;font-size:14px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;}
.category-row-actions{display:flex;align-items:center;gap:4px;flex:none;}
.category-row-action{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--ink-soft);transition:background .15s ease,color .15s ease;}
.category-row-action svg{width:16px;height:16px;}
.category-row-action.edit:hover{background:var(--primary-tint);color:var(--primary);}
.category-row-action.delete:hover{background:var(--expense-tint);color:var(--expense);}
.category-empty{padding:18px 12px;border:1px dashed var(--border);border-radius:13px;color:var(--ink-faint);font-size:13px;text-align:center;}
.category-modal{width:min(100%,480px);height:auto;max-height:min(90dvh,780px);padding:0;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;}
.category-modal .modal-head{position:relative;top:auto;flex:none;margin:0;padding:20px 18px 14px;border-bottom:1px solid var(--border);border-radius:22px 22px 0 0;}
.category-modal .modal-head h3{font-size:23px;}
.category-modal-intro{flex:none;margin:0;padding:12px 18px 15px;color:var(--ink-soft);font-size:13px;line-height:1.5;border-bottom:1px solid color-mix(in srgb,var(--border) 62%,transparent);}
.category-modal form{display:flex;flex:1;flex-direction:column;min-height:0;overflow:hidden;}
.category-modal-fields{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 0;overscroll-behavior:contain;}
.category-modal .field{margin-bottom:17px;}
.category-modal .field label{font-size:13px;margin-bottom:8px;}
.category-modal .field input{min-height:48px;border-radius:12px;background:var(--bg);}
.category-modal .type-toggle{gap:4px;padding:4px;border-radius:13px;background:var(--bg);}
.category-modal .type-toggle button{min-height:42px;border-radius:9px;}
.category-preview{display:flex;align-items:center;gap:11px;margin:0 0 16px;padding:11px 12px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(135deg,var(--surface),var(--bg));}
.category-preview-icon{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:13px;background:var(--primary-tint);color:var(--primary);}
.category-preview-icon svg{width:21px;height:21px;}
.category-preview-name{font-size:14px;font-weight:700;}
.category-preview-hint{margin-top:2px;font-size:11.5px;color:var(--ink-faint);}
.category-icon-trigger{width:100%;min-height:58px;display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--border);border-radius:13px;background:var(--surface);color:var(--ink);text-align:left;transition:border-color .15s ease,box-shadow .15s ease;}
.category-icon-trigger:hover{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 9%,transparent);}
.category-icon-trigger .category-preview-icon{width:40px;height:40px;}
.category-icon-trigger-copy{min-width:0;flex:1;}
.category-icon-trigger-title,.category-icon-trigger-note{display:block;}
.category-icon-trigger-title{font-size:13.5px;font-weight:600;}
.category-icon-trigger-note{margin-top:2px;color:var(--ink-faint);font-size:11.5px;}
.category-icon-trigger-chevron{width:17px;height:17px;flex:none;color:var(--ink-faint);}
.category-icon-modal{width:min(100%,460px);height:min(78dvh,700px);max-height:84dvh;padding:0;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;}
.category-icon-modal .modal-head{position:relative;top:auto;flex:none;margin:0;padding:20px 22px 14px;border-bottom:1px solid var(--border);}
.category-icon-modal .modal-head h3{font-size:22px;}
.category-icon-modal-intro{flex:none;padding:11px 22px 0;color:var(--ink-soft);font-size:13px;line-height:1.5;}
.category-icon-modal .category-icon-search{width:calc(100% - 44px);height:43px;min-height:43px;flex:none;margin:13px 22px 12px;padding:0 12px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--ink);font:13px Inter,sans-serif;}
.category-icon-search:focus{outline:2px solid color-mix(in srgb,var(--primary) 40%,transparent);border-color:var(--primary);}
.category-icon-modal .category-icon-grid{flex:1;min-height:0;max-height:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-content:start;gap:8px;overflow:auto;padding:2px 22px 18px;overscroll-behavior:contain;}
.category-icon-no-results{grid-column:1/-1;padding:18px 8px;color:var(--ink-faint);font-size:13px;text-align:center;}
.category-icon-option{aspect-ratio:1;min-width:0;display:grid;place-items:center;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--ink-soft);transition:transform .15s ease,border-color .15s ease,background .15s ease,color .15s ease;}
.category-icon-option[hidden]{display:none;}
.category-icon-option svg{width:20px;height:20px;}
.category-icon-option:hover{transform:translateY(-1px);border-color:var(--border);color:var(--primary);}
.category-icon-option.selected{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 3px 9px color-mix(in srgb,var(--primary) 22%,transparent);}
.category-icon-option:focus-visible,.category-row-action:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.category-icon-modal-footer{flex:none;padding:12px 22px calc(15px + env(safe-area-inset-bottom));border-top:1px solid var(--border);color:var(--ink-faint);font-size:12px;text-align:center;}
.category-modal .modal-actions{flex:none;margin:0;padding:14px 18px 20px;border-top:1px solid var(--border);background:var(--surface);}
.category-modal .modal-actions .btn{min-height:46px;justify-content:center;}
.receipt-icon.category-icon{background:var(--primary-tint)!important;color:var(--primary);}
.receipt-icon.category-icon svg{width:18px;height:18px;}
@media(prefers-reduced-motion:reduce){.categories-page-enter,.categories-page-exit{animation:none!important;}}

@media (max-width: 860px){
  .sidebar{display:none;}
  .main{padding:16px 14px 96px 14px;}
  .dashboard-add{display:none;}
  .grid.cols-3{grid-template-columns:1fr 1fr;}
  .grid.cols-3.wallet-grid{grid-template-columns:minmax(0,1fr);}
  .grid.cols-2{grid-template-columns:1fr;}
  .hero .amount{font-size:34px;}
  .mobile-topbar{
    display:flex; align-items:flex-start; gap:10px; padding:2px 2px 16px 2px;
  }
  .mobile-topbar .brand-mark{width:26px;height:26px;font-size:13px;}
  .mobile-brand-copy{display:flex;flex-direction:column;align-items:flex-start;transform:translateY(-2px);}
  .mobile-topbar .brand-name{font-size:14px;line-height:17px;}
  .mobile-username{font-size:10px;line-height:13px;color:var(--ink-soft);}
  .mobile-settings{margin-left:auto;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:11px;background:var(--surface);color:var(--primary);}
  .mobile-settings svg{width:20px;height:20px;}
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:var(--surface); border-top:1px solid var(--border);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom)) 6px;
    justify-content:space-around;
  }
  .bottom-nav button{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-faint); font-size:10.5px; font-weight:600; padding:4px 6px;
  }
  .bottom-nav button.active{color:var(--primary);}
  #app.categories-mobile-view .bottom-nav{display:none;}
  #app.categories-mobile-view .main{padding-bottom:24px;}
  #app.categories-mobile-view .mobile-topbar{display:none;}
  #app.categories-mobile-view .categories-back{display:inline-flex;align-items:center;gap:8px;margin:0 0 17px;padding:8px 11px;border:1px solid var(--border);border-radius:11px;background:var(--surface);color:var(--ink-soft);font:600 13px Inter,sans-serif;}
  #app.categories-mobile-view .categories-back svg{width:17px;height:17px;color:var(--primary);}
  #app.categories-mobile-view .categories-page-title-row h1{font-size:29px;}
  #app.categories-mobile-view .categories-page-header{margin-bottom:20px;}
  #app.categories-mobile-view .categories-page-title-row>.btn{width:40px;height:40px;min-height:40px;padding:8px;justify-content:center;flex:none;}
  #app.categories-mobile-view .categories-add-label{display:none;}
  #app.categories-mobile-view .categories-page-content{max-width:540px;margin:0 auto;}
  #app.categories-mobile-view .categories-groups{grid-template-columns:1fr;gap:22px;}
  #app.categories-mobile-view .categories-page-title-row{align-items:center;}
  #app.categories-mobile-view .categories-page-title-row .sub{font-size:14px;max-width:300px;}
  #app.categories-mobile-view .category-list{padding:10px!important;gap:7px;}
  #app.categories-mobile-view .category-row{min-height:54px;padding:8px 9px;}
  #app.categories-mobile-view .category-row-name{font-size:14.5px;}
  #app.categories-mobile-view .category-row-action{width:36px;height:36px;}
  .category-modal{height:auto;max-height:min(88dvh,760px);border-radius:20px;}
  .category-modal .modal-head{padding:17px 14px 13px;border-radius:20px 20px 0 0;}
  .category-modal-intro{padding:10px 14px 13px;}
  .category-modal-fields{padding:14px 14px 0;}
  .category-modal .modal-actions{padding:12px 14px calc(15px + env(safe-area-inset-bottom));}
  .category-icon-grid{grid-template-columns:repeat(6,minmax(0,1fr));max-height:210px;}
  .category-icon-modal{height:min(76dvh,700px);border-radius:20px;}
  .category-icon-modal .modal-head{padding:17px 19px 13px;border-radius:20px 20px 0 0;}
  .category-icon-modal-intro{padding:10px 19px 0;}
  .category-icon-modal .category-icon-search{width:calc(100% - 38px);margin:12px 19px 10px;}
  .category-icon-modal .category-icon-grid{grid-template-columns:repeat(6,minmax(0,1fr));padding:2px 19px 16px;}
  .category-icon-modal-footer{padding:11px 19px calc(13px + env(safe-area-inset-bottom));}
  .wallet-modal{max-height:min(88dvh,760px);border-radius:20px;}
  .wallet-modal .modal-head{padding:17px 14px 13px;border-radius:20px 20px 0 0;}
  .wallet-modal-intro{padding:10px 14px 13px;}
  .wallet-modal-fields{padding:14px 14px 0;}
  .wallet-modal-footer{padding:12px 14px calc(15px + env(safe-area-inset-bottom));}
  .wallet-choice-modal{max-height:min(80dvh,680px);border-radius:20px;}
  .wallet-choice-modal .modal-head{padding:17px 14px 13px;border-radius:20px 20px 0 0;}
  .wallet-choice-intro{padding:10px 14px 13px;}
  .wallet-choice-grid{gap:8px;padding:0 14px 15px;}
  .wallet-choice-option{min-height:62px;padding:8px;gap:8px;}
  .wallet-choice-option .wallet-icon{width:34px;height:34px;}
  .fab{
    display:flex; position:fixed; right:18px; bottom:78px; z-index:51;
    width:54px; height:54px; border-radius:50%; background:var(--primary); color:#fff;
    align-items:center; justify-content:center; border:none; box-shadow:0 8px 20px rgba(122,59,59,0.4);
    font-size:26px;
  }
}
@media (min-width:861px){
  .desktop-fab{
    position:fixed; right:36px; bottom:36px; z-index:51;
    width:56px; height:56px; border-radius:50%; background:var(--primary); color:#fff;
    align-items:center; justify-content:center; border:none; box-shadow:0 10px 26px rgba(122,59,59,0.35);
    font-size:26px; display:flex;
  }
  .desktop-fab:hover{background:var(--primary-dark);}
}

.loading-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft); font-family:'Dancing Script',cursive; font-size:24px; font-weight:700;
}
.login-screen{flex:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--primary-tint) 72%,var(--bg)),transparent 55%),var(--bg);}
.login-box{width:min(100%,410px);margin:0;background:var(--surface);border:1px solid color-mix(in srgb,var(--primary) 14%,var(--border));border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(48,23,24,.11);}
.login-brand{display:flex;align-items:center;gap:11px;margin-bottom:21px;}
.login-mark{width:42px;height:42px;display:block;object-fit:cover;border-radius:11px;box-shadow:0 5px 12px color-mix(in srgb,var(--primary) 22%,transparent);}
.login-brand-copy{display:grid;gap:2px;}
.login-brand-copy strong{font:600 13px Inter,sans-serif;color:var(--ink);}
.login-brand-copy small{font-size:10px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;}
.login-box h2{font-family:'Dancing Script',cursive;font-size:37px;font-weight:700;margin-bottom:4px;}
.login-box .sub{color:var(--ink-soft);font-size:13px;margin-bottom:24px;}
.login-box .field{margin-bottom:16px;}
.login-box .field label{font-size:12px;margin-bottom:7px;}
.login-box .field input{min-height:48px;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:linear-gradient(135deg,var(--bg),var(--surface));color:var(--ink);font-size:14px;}
.login-box .field input:focus{outline:2px solid color-mix(in srgb,var(--primary) 55%,transparent);background:var(--surface);}
.password-input-wrap{position:relative;}
.login-box .field .password-input-wrap input{padding-right:48px;}
.login-password-toggle{position:absolute;top:50%;right:7px;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--ink-faint);}
.login-password-toggle:hover{background:var(--primary-tint);color:var(--primary);}
.login-password-toggle:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}
.login-password-toggle svg{width:18px;height:18px;}
.remember-me{display:flex;align-items:center;gap:9px;margin:-1px 0 14px;color:var(--ink-soft);cursor:pointer;}
.remember-me input{width:16px;height:16px;flex:0 0 16px;margin:0;accent-color:var(--primary);}
.remember-me span{font-size:12px;font-weight:550;}
.login-submit{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-height:48px;margin-top:3px;border-radius:13px;font-size:14px;font-weight:650;box-shadow:0 5px 14px color-mix(in srgb,var(--primary) 19%,transparent);}
.auth-toggle{text-align:center;margin-top:19px;font-size:12px;color:var(--ink-soft);}
.auth-toggle button{background:none; border:none; color:var(--primary); font-weight:600; font-size:13px; padding:0 4px;}
.auth-toggle button:hover{text-decoration:underline;}
.login-note{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-size:11px;line-height:1.5;color:var(--ink-faint);text-align:center;}
@media(max-width:420px){.login-screen{align-items:center;padding:22px 18px;}.login-box{padding:26px 22px;border-radius:21px;}.login-brand{margin-bottom:18px;}.login-box h2{font-size:34px;}}

/* Savings goals: keep cards legible and actions predictable at every width. */
.goal-card{padding:20px; overflow:hidden;}
.goal-name{font-size:16px; line-height:1.35;}
.goal-deadline{line-height:1.5;}
.goal-type-pill{grid-column:1/-1;justify-self:start;max-width:100%;}
.goal-card .progress-track{height:9px;margin:15px 0 10px;}
.goal-card .progress-fill{background:linear-gradient(90deg,var(--gold),#C99A54);transition:width .45s cubic-bezier(.2,.75,.25,1);}
.goal-card > .btn.secondary{min-height:40px;}
.goal-remaining{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;padding:10px 12px;background:var(--gold-tint);border-radius:10px;color:var(--ink-soft);font-size:12px;}
.goal-remaining strong{color:var(--ink);font-size:12px;}
.goal-remaining.complete{background:var(--income-tint);color:var(--income);}
.goal-remaining.complete strong{color:var(--income);}
.goal-card{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;}
.goal-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--primary) 24%,var(--border));box-shadow:0 10px 28px rgba(74,16,40,.11);}
.goal-card:focus-visible{outline:3px solid color-mix(in srgb,var(--gold) 65%,white);outline-offset:3px;}
.goal-details-modal{max-width:620px;}
.goal-detail-hero{padding:20px;border:1px solid var(--border);border-radius:17px;background:linear-gradient(145deg,var(--surface),var(--bg));}
.goal-detail-title-row{display:flex;align-items:center;gap:12px;}
.goal-detail-title-row .goal-icon-preview{width:48px;height:48px;}
.goal-detail-title-row .goal-icon-preview svg{width:26px;height:26px;}
.goal-detail-name{font:600 22px 'Fraunces',serif;}
.goal-detail-type{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.goal-detail-current{font:600 clamp(30px,7vw,42px) system-ui,sans-serif;color:var(--income);margin-top:20px;}
.goal-detail-period{font-size:13px;color:var(--ink-faint);margin-top:4px;}
.goal-detail-progress{height:13px;border-radius:99px;background:var(--gold-tint);overflow:hidden;margin:20px 0 10px;}
.goal-detail-progress > span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--income),#73AE72);transition:width .45s cubic-bezier(.2,.75,.25,1);}
.goal-detail-stats{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-soft);}
.goal-detail-stats strong{color:var(--ink);}
.goal-detail-remaining{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--border);padding-top:14px;margin-top:17px;font-size:13px;color:var(--ink-soft);}
.goal-detail-remaining strong{font:600 16px system-ui,sans-serif;color:var(--ink);}
.goal-schedule{margin-top:20px;}
.goal-schedule-head{display:grid;justify-content:stretch;gap:4px;margin-bottom:10px;}
.goal-schedule-head h4{margin:0;font:600 17px 'Fraunces',serif;}
.goal-schedule-summary{display:grid;gap:2px;}
.goal-schedule-summary strong{font:600 14px system-ui,sans-serif;color:var(--ink);}
.goal-schedule-summary small{font-size:11px;color:var(--ink-faint);}
.goal-schedule-list{display:grid;gap:9px;max-height:32vh;overflow:auto;padding:2px 3px 3px 1px;}
.goal-schedule-month{display:grid;gap:7px;}
.goal-schedule-month+.goal-schedule-month{margin-top:5px;}
.goal-schedule-month-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;list-style:none;}
.goal-schedule-month-head::-webkit-details-marker{display:none;}
.goal-schedule-month-head::after{content:'⌄';margin-left:2px;color:var(--ink-faint);font-size:15px;transition:transform .18s ease;}
.goal-schedule-month:not([open]) .goal-schedule-month-head::after{transform:rotate(-90deg);}
.goal-schedule-month-head strong{font-size:12px;color:var(--ink);}
.goal-schedule-month-head span{font:600 11px system-ui,sans-serif;color:var(--primary);white-space:nowrap;}
.goal-schedule-month-rows{display:grid;gap:7px;padding-left:14px;border-left:2px solid var(--primary-tint);}
.goal-schedule-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:0 3px 12px rgba(74,16,40,.05);}
.goal-schedule-row[role="button"]{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;}
.goal-schedule-row[role="button"]:hover,.goal-schedule-row[role="button"]:focus-visible{transform:translateY(-1px);box-shadow:0 5px 16px rgba(74,16,40,.1);border-color:var(--primary);outline:none;}
.goal-schedule-row.is-complete{background:color-mix(in srgb,#3d805f 8%,var(--surface));border-color:color-mix(in srgb,#3d805f 30%,var(--border));}
.goal-schedule-row.is-complete .goal-schedule-mark{background:color-mix(in srgb,#3d805f 14%,var(--surface));color:#347351;}
.goal-schedule-row.is-complete .goal-schedule-amount{color:#347351;}
.goal-schedule-row.is-due{background:var(--gold-tint);border-color:color-mix(in srgb,var(--gold) 38%,var(--border));}
.goal-schedule-row.is-due .goal-schedule-mark{background:var(--surface);color:var(--gold);}
.goal-schedule-row.is-missed{background:var(--expense-tint);border-color:color-mix(in srgb,var(--expense) 38%,var(--border));}
.goal-schedule-row.is-missed .goal-schedule-mark{background:var(--surface);color:var(--expense);}
.goal-schedule-mark{width:36px;height:36px;border-radius:11px;background:var(--primary-tint);color:var(--primary);display:grid;place-items:center;flex-shrink:0;}
.goal-schedule-mark svg{width:19px;height:19px;}
.goal-schedule-date{flex:1;font-size:13px;font-weight:500;}
.goal-schedule-amount{text-align:right;font:600 15px system-ui,sans-serif;color:var(--ink-soft);white-space:nowrap;}
.goal-schedule-amount small{display:block;max-width:170px;white-space:normal;font:500 10px 'Inter',sans-serif;color:var(--ink-faint);margin-top:2px;}
.goal-schedule-clear{border:0;background:transparent;padding:0 2px;color:var(--expense);font:600 10px 'Inter',sans-serif;cursor:pointer;}
.goal-schedule-clear:hover{text-decoration:underline;color:var(--primary);}
.goal-schedule-empty{padding:18px;text-align:center;border:1px dashed var(--border);border-radius:13px;color:var(--ink-faint);font-size:13px;}
.goal-details-actions{display:flex;gap:10px;margin-top:16px;}
.goal-details-actions .btn{flex:1;justify-content:center;min-height:44px;}
.goal-type-pill{display:inline-flex;align-items:center;max-width:100%;font-size:11px;color:var(--ink-soft);padding:5px 9px;background:var(--bg);border-radius:999px;line-height:1.3;}
.goal-overview{position:relative;isolation:isolate;overflow:hidden;margin:0 0 20px;padding:20px;border:1px solid color-mix(in srgb,var(--primary) 18%,var(--border));border-radius:21px;background:linear-gradient(130deg,var(--primary-dark),var(--primary) 72%,color-mix(in srgb,var(--primary) 82%,var(--gold)));color:#fff;box-shadow:0 12px 28px color-mix(in srgb,var(--primary) 17%,transparent);}
.goal-overview::after{content:"";position:absolute;z-index:-1;width:190px;height:190px;right:-78px;top:-105px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 38%,transparent),transparent 70%);pointer-events:none;}
.goal-overview-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.goal-overview-kicker{display:block;margin-bottom:5px;color:rgba(255,255,255,.68);font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;}
.goal-overview-label{font-size:16px;font-weight:600;color:#fff;}
.goal-overview-total{font:600 clamp(23px,6vw,30px) system-ui,sans-serif;letter-spacing:-.05em;line-height:1.1;text-align:right;overflow-wrap:anywhere;}
.goal-overview-progress{height:7px;margin-top:17px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;}
.goal-overview-progress span{display:block;height:100%;border-radius:inherit;background:#E7BD71;transition:width .4s ease;}
.goal-overview-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;color:rgba(255,255,255,.72);font-size:10px;}
.goal-overview-meta strong{color:#fff;font-weight:700;white-space:nowrap;}
.goal-overview-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px;}
.goal-overview-stat{min-width:0;padding:11px 12px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.09);}
.goal-overview-stat span{display:block;color:rgba(255,255,255,.72);font-size:10px;font-weight:600;}
.goal-overview-stat strong{display:block;margin-top:6px;color:#fff;font:600 clamp(13px,3.6vw,16px) system-ui,sans-serif;overflow-wrap:anywhere;}
.goal-plan-heading{margin:0 1px 10px;color:var(--ink-soft);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.goal-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 22px;}
.goal-summary-item{min-width:0;padding:16px 18px;border-radius:16px;}
.goal-weekly-summary,.goal-monthly-card{grid-column:auto;}
.goal-list-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 1px 12px;}
.goal-list-heading h2{font:600 15px Inter,sans-serif;color:var(--ink);}
.goal-summary-item .k{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.07em;font-weight:600;}
.goal-summary-item .v{font:600 20px system-ui,sans-serif;margin-top:5px;}
.goal-weekly-summary{background:linear-gradient(145deg,var(--primary-tint),var(--surface));border-color:color-mix(in srgb,var(--primary) 18%,var(--border));}
.goal-weekly-summary-head,.goal-weekly-summary-value{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.goal-weekly-summary-date{font-size:11px;color:var(--ink-faint);white-space:nowrap;}
.goal-weekly-summary-value{margin-top:6px;}
.goal-weekly-summary-value .v{margin:0;color:var(--primary);font-size:clamp(16px,2vw,20px);}
.goal-weekly-summary-state{font-size:11px;font-weight:600;color:var(--primary);text-align:right;}
.goal-week-balance-note{font-size:11px;color:var(--ink-soft);margin-top:6px;}
.goal-monthly-card{background:linear-gradient(145deg,var(--gold-tint),var(--surface));border-color:color-mix(in srgb,var(--gold) 26%,var(--border));}
.goal-monthly-summary{height:100%;}
.goal-monthly-summary-head,.goal-monthly-summary-stats,.goal-monthly-summary-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.goal-monthly-summary-head{font-size:10px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.goal-monthly-summary-stats{margin-top:8px;}
.goal-monthly-summary-stat{display:grid;gap:3px;}
.goal-monthly-summary-stat:last-child{text-align:right;}
.goal-monthly-summary-stat small{font-size:10px;color:var(--ink-faint);}
.goal-monthly-summary-stat strong{font:600 14px system-ui,sans-serif;color:var(--ink);}
.goal-monthly-progress{height:6px;border-radius:99px;background:var(--primary-tint);overflow:hidden;margin-top:9px;}
.goal-monthly-progress span{display:block;height:100%;border-radius:inherit;background:var(--primary);transition:width .35s ease;}
.goal-monthly-summary-foot{margin-top:6px;font-size:10px;color:var(--ink-soft);}
.goal-monthly-summary-foot strong{color:var(--primary);font-weight:700;}
.goal-icon-trigger{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--ink);text-align:left;}
.goal-icon-trigger:hover{border-color:var(--primary);background:var(--surface);}
.goal-icon-trigger-copy{flex:1;min-width:0;}
.goal-icon-trigger-copy strong{display:block;font-size:13px;}
.goal-icon-trigger-copy small{display:block;color:var(--ink-faint);font-size:11px;margin-top:2px;}
.goal-icon-trigger .picker-chevron{color:var(--ink-faint);font-size:18px;}
.goal-split-toggle{display:flex;align-items:flex-start;gap:10px;padding:14px;border:1px solid var(--border);border-radius:15px;background:linear-gradient(135deg,var(--surface),var(--bg));cursor:pointer;}
.field label.goal-split-toggle{display:flex;align-items:center;gap:12px;margin-bottom:0;}
.goal-split-toggle input[type=checkbox],.goal-day-option input[type=checkbox]{appearance:none;-webkit-appearance:none;display:grid;place-content:center;flex:0 0 auto;width:21px;height:21px;margin:0;border:1.5px solid var(--border-strong,var(--ink-faint));border-radius:7px;background:var(--bg);cursor:pointer;transition:background .16s ease,border-color .16s ease,box-shadow .16s ease;}
.goal-split-toggle input[type=checkbox]::after,.goal-day-option input[type=checkbox]::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) scale(0);transition:transform .12s ease;}
.goal-split-toggle input[type=checkbox]:checked,.goal-day-option input[type=checkbox]:checked{background:var(--primary);border-color:var(--primary);}
.goal-split-toggle input[type=checkbox]:checked::after,.goal-day-option input[type=checkbox]:checked::after{transform:rotate(-45deg) scale(1);}
.goal-split-toggle input[type=checkbox]:focus-visible,.goal-day-option input[type=checkbox]:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 25%,transparent);outline-offset:2px;}
.goal-split-toggle:hover,.goal-day-option:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--border));}
.goal-split-toggle:has(input:checked){background:color-mix(in srgb,var(--primary-tint) 65%,var(--surface));border-color:color-mix(in srgb,var(--primary) 38%,var(--border));}
.goal-split-toggle span{display:grid;gap:3px;}
.goal-split-toggle strong{font-size:12px;color:var(--ink);}
.goal-split-toggle small{font-size:11px;line-height:1.45;color:var(--ink-faint);font-weight:400;}
.goal-day-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px;}
.field label.goal-day-option{display:flex;align-items:center;justify-content:flex-start;gap:7px;min-height:44px;padding:8px 9px;margin:0;border:1px solid var(--border);border-radius:13px;background:var(--surface);color:var(--ink-soft);cursor:pointer;transition:background .16s ease,border-color .16s ease,color .16s ease,transform .16s ease;}
.goal-day-option:has(input:checked){background:var(--primary-tint);border-color:color-mix(in srgb,var(--primary) 42%,var(--border));color:var(--primary);font-weight:600;}
.goal-day-option span{font-size:12px;line-height:1;}
.goal-icon-option{aspect-ratio:1;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .15s ease;min-width:0;}
.goal-icon-option[hidden]{display:none;}
.goal-icon-option svg{width:21px;height:21px;}
.goal-icon-option:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px);}
.goal-icon-option.selected{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 3px 8px color-mix(in srgb,var(--primary) 22%,transparent);}
.goal-icon-option span{font-size:10px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;}
.goal-icon-overlay{position:fixed;inset:0;z-index:120;background:rgba(36,20,24,.46);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;}
.goal-icon-modal{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:20px;width:min(560px,100%);max-height:min(82dvh,700px);display:flex;flex-direction:column;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.26);}
.goal-icon-modal-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;}
.goal-icon-modal-head h3{font-size:23px;}
.goal-icon-modal-head p{font-size:12px;color:var(--ink-soft);margin:4px 0 0;}
.goal-icon-modal-head .modal-close{margin-left:auto;}
.goal-icon-search{width:100%;padding:11px 13px;margin-bottom:13px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--ink);font:inherit;}
.goal-icon-search:focus{outline:2px solid var(--primary);}
.goal-icon-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;overflow-y:auto;padding:1px 3px 5px 1px;}
.goal-icon-empty{display:none;text-align:center;color:var(--ink-faint);padding:26px 8px;font-size:13px;}
.goal-icon-preview{width:38px;height:38px;border-radius:12px;background:var(--primary-tint);color:var(--primary);display:inline-grid;place-items:center;flex-shrink:0;}
.goal-icon-preview svg{width:21px;height:21px;}
.goal-name-row{display:flex;align-items:center;gap:10px;}
.goal-dates-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start;}
.goal-dates-row .field{min-width:0;}
.goal-dates-row label{min-height:0;line-height:1.35;white-space:nowrap;}
.goal-date-note{display:block;min-height:16px;margin:-3px 0 6px;font-size:10px;line-height:1.3;color:var(--ink-faint);}
.goal-dates-row input[type="date"]{width:100%;min-width:0;min-height:46px;display:block;font-size:13px;padding:10px 9px;}
.modal{overscroll-behavior:contain;}
.modal.goal-modal{display:flex;flex-direction:column;overflow:hidden;max-height:min(88dvh,800px);padding-bottom:0;}
.goal-modal{width:min(100%,540px);border:1px solid color-mix(in srgb,var(--primary) 11%,var(--border));border-radius:24px;box-shadow:0 24px 72px rgba(53,24,24,.22);}
.goal-modal .modal-head{flex:0 0 auto;position:relative;z-index:2;background:var(--surface);padding-bottom:15px;margin-bottom:12px;border-bottom:1px solid var(--border);}
.goal-modal .modal-head h3{font-size:25px;letter-spacing:-.025em;}
.goal-modal form{display:flex;flex:1 1 auto;min-height:0;flex-direction:column;overflow:hidden;}
.goal-form-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:3px 5px 18px 0;scrollbar-gutter:stable;}
.goal-modal .field{margin-bottom:16px;}
.goal-modal .field>label:not(.goal-split-toggle):not(.goal-day-option){font-size:12px;letter-spacing:.015em;margin-bottom:7px;}
.goal-modal .field input,.goal-modal .field select{min-height:46px;border-radius:12px;background:linear-gradient(135deg,var(--bg),var(--surface));}
.goal-modal .field input[readonly]{color:var(--ink-soft);font-size:13px;}
.goal-modal #periodic-fields{padding:15px 14px 2px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(155deg,color-mix(in srgb,var(--primary-tint) 35%,var(--surface)),var(--surface) 60%);margin:2px 0 16px;}
.goal-modal #periodic-fields .field-row{gap:10px;}
.goal-modal #periodic-fields .field-row .field{min-width:0;}
.goal-modal .type-toggle{gap:4px;padding:4px;margin-bottom:2px;border-radius:13px;background:var(--bg);}
.goal-modal .type-toggle button{min-height:42px;border-radius:9px;background:transparent;transition:background .16s ease,color .16s ease;}
.goal-modal .type-toggle button.active.exp,.goal-modal .type-toggle button.active.inc{background:var(--primary);color:white;}
.goal-modal .modal-actions{flex:0 0 auto;position:relative;z-index:2;background:var(--surface);padding:13px 0 max(16px,env(safe-area-inset-bottom));margin:0;border-top:1px solid var(--border);}
.goal-modal .modal-actions .btn{min-height:46px;border-radius:13px;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--gold) 65%,white);outline-offset:2px;}

/* iOS Safari zooms the page when a focused form control uses text smaller than 16px. */
@media (max-width:860px){
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):focus,
  select:focus,
  textarea:focus{font-size:16px!important;}

/* ---------------- MongoDB API ---------------- */
let authToken = localStorage.getItem('ledger_remember_me')==='true'
  ? localStorage.getItem('ledger_remember_token')
  : sessionStorage.getItem('ledger_token');
let serverDataVersion = 0;
let pendingSaves = 0;
let remoteSyncPending = false;
let realtimeSyncInFlight = false;
let realtimeSyncTimer = null;
async function api(path, options={}){
  const response = await fetch('/api' + path, {
    ...options,
    headers:{'Content-Type':'application/json', ...(authToken?{Authorization:`Bearer ${authToken}`}:{ }), ...(options.headers||{})}
  });
  const result = await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(result.error || 'The server request failed.');
  return result;
}
async function loadUserData(){
  const data = await api('/data');
  serverDataVersion = Number(data._version)||0;
  state.wallets = data.wallets ?? DEFAULT_WALLETS;
  state.categories = data.categories ?? DEFAULT_CATEGORIES;
  state.goals = data.goals ?? [];
  state.transactions = data.transactions ?? [];
  state.atomeLoans = Array.isArray(data.atomeLoans) ? data.atomeLoans : [];
  reconcileCreditPurchaseLoans();
  processRecurringGoals();
}
function saveKey(key, value){
  if(!state.user || !authToken) return;
  pendingSaves++;
  api('/data', {method:'PUT', body:JSON.stringify({key,value})})
    .then(result=>{if(Number(result.version)>serverDataVersion) remoteSyncPending=true;})
    .catch(error=>console.error('Save failed:', error))
    .finally(()=>{pendingSaves=Math.max(0,pendingSaves-1);if(!pendingSaves&&remoteSyncPending) syncRemoteData();});
}

async function checkForRemoteUpdates(){
  if(!state.user||!authToken) return;
  try{
    const result=await api('/version');
    if(Number(result.version)>serverDataVersion){
      remoteSyncPending=true;
      if(!pendingSaves&&!document.querySelector('.overlay')) await syncRemoteData();
    }
  }catch(error){console.debug('Live sync check skipped:',error.message);}
}
async function syncRemoteData(){
  if(!remoteSyncPending||realtimeSyncInFlight||pendingSaves||!state.user||!authToken||document.querySelector('.overlay')) return;
  remoteSyncPending=false;
  realtimeSyncInFlight=true;
  try{
    await loadUserData();
    state.loaded=true;
    render();
  }catch(error){remoteSyncPending=true;console.debug('Live sync refresh skipped:',error.message);}
  finally{realtimeSyncInFlight=false;if(remoteSyncPending&&!document.querySelector('.overlay')) syncRemoteData();}
}
function startRealtimeSync(){
  if(realtimeSyncTimer) clearInterval(realtimeSyncTimer);
  checkForRemoteUpdates();
  realtimeSyncTimer=setInterval(checkForRemoteUpdates,2500);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden) checkForRemoteUpdates();});
window.addEventListener('focus',checkForRemoteUpdates);

/* ---------------- Auth ---------------- */

async function login(username, password, rememberMe=false){
  try{
    const result = await api('/auth/login', {method:'POST', body:JSON.stringify({username,password})});
    authToken = result.token;
    localStorage.setItem('ledger_remember_me',String(rememberMe));
    if(rememberMe){
      localStorage.setItem('ledger_remember_token',authToken);
      localStorage.setItem('ledger_remember_username',result.username);
      sessionStorage.removeItem('ledger_token');
    }else{
      localStorage.removeItem('ledger_remember_token');
      localStorage.removeItem('ledger_remember_username');
      sessionStorage.setItem('ledger_token',authToken);
    }
    state.user = result.username;
    await loadUserData();
    state.loaded = true;
    applyTheme(state.theme);
    render();
    startRealtimeSync();
    return true;
  }catch(error){ alert(error.message); return false; }
}

/* ---------------- Recurring goals with day-of-week support ---------------- */
function processRecurringGoals(){
  const today = todayStr();
  let changed = false;
  state.goals.forEach(g => {
    if(g.type !== 'periodic') return;
    if(!g.lastContribution) g.lastContribution = g.startDate || today;
    if(!g.startDate) g.startDate = today;
    if(goalUsesWeeklyDeposits(g)&&!Number(g.monthlyDeposit)){
      const months=Math.max(1,countGoalDepositCycles(g.startDate,g.targetDate,'month',1,[]));
      g.monthlyDeposit=g.splitWeekly?(Number(g.deposit)||0):Math.ceil((Number(g.target)/months)*100)/100;
      changed=true;
    }
    if(g.current >= g.target) return;
    const nextDue=nextGoalDueDate(g,g.lastContribution);
    const weeklySchedule=goalUsesWeeklyDeposits(g);
    if(nextDue && today>=goalDateString(nextDue) && (!g.targetDate || (weeklySchedule?goalDateString(nextDue)<g.targetDate:goalDateString(nextDue)<=g.targetDate)) && g.current < g.target){
      const dueValue=goalDateString(nextDue);
      const amount=weeklySchedule?goalWeeklyInstallment(g,dueValue):(Number(g.deposit)||0);
      if(amount<=0){g.lastContribution=dueValue;changed=true;return;}
      const fromWallet = state.wallets[0];
      const addAmt = Math.min(amount, g.target - g.current, fromWallet?walletAvailableBalance(fromWallet.id):0);
      if(addAmt<=0) return;
      g.current = Math.round((g.current + addAmt) * 100) / 100;
      g.lastContribution = dueValue;
      g.depositHistory=Array.isArray(g.depositHistory)?g.depositHistory:[];
      const depositEntry={date:dueValue,amount:addAmt};
      g.depositHistory.push(depositEntry);
      if(weeklySchedule) addGoalMonthSaved(g,dueValue.slice(0,7),addAmt);
      changed = true;
      let goalCat = state.categories.find(c=>c.id==='c-savings-auto');
      if(!goalCat){
        goalCat = {id:'c-savings-auto', name:'Auto Savings', type:'expense', color:'#C9A227'};
        state.categories.push(goalCat);
        saveKey('categories', state.categories);
      }
      if(fromWallet){
        const transactionId=uid();
        state.transactions.push({
          id:transactionId,
          amount: addAmt,
          walletId: fromWallet.id,
          categoryId: goalCat.id,
          date: today,
          note: `Periodic contribution to "${g.name}" (${g.cycle}) [goal:${g.id}] (scheduled ${dueValue})`,
          type:'expense'
        });
        depositEntry.transactionId=transactionId;
        depositEntry.walletId=fromWallet.id;
        saveKey('transactions', state.transactions);
      }
    }
  });
  if(changed){
    saveKey('goals', state.goals);
    saveKey('transactions', state.transactions);
  }
}

/* ---------------- Goal reset ---------------- */
function resetGoal(goalId){
  const g = state.goals.find(x=>x.id===goalId);
  if(!g) return;
  if(!confirm(`Reset "${g.name}"? This will set saved amount to zero. Existing transactions will NOT be removed from wallets.`)) return;
  g.current = 0;
  g.lastContribution = g.startDate || todayStr();
  saveKey('goals', state.goals);
  render();
}
window.resetGoal = resetGoal;

/* ---------------- Derived helpers ---------------- */
function walletBalance(walletId){
  const wallet=state.wallets.find(item=>item.id===walletId);
  if(isAtomeWallet(wallet)) return Math.round(walletAvailableBalance(walletId)*100)/100;
  return Math.round((walletAvailableBalance(walletId)+walletSavedBalance(walletId))*100)/100;
}
function isCreditType(type){ return ['atome','tiktok-paylater','shopee-paylater'].includes(type); }
function isCreditWallet(wallet){ return Boolean(wallet)&&isCreditType(walletIconType(wallet)); }
function isAtomeWallet(wallet){ return isCreditWallet(wallet); }
function creditWalletName(wallet){
  if(!wallet) return 'Credit';
  const type=walletIconType(wallet);
  return WALLET_TYPES.find(item=>item.id===type)?.name||'Credit wallet';
}
function atomeLoanPaid(loan){ return (loan.payments||[]).reduce((sum,payment)=>sum+(Number(payment.amount)||0),0); }
function atomeLoanRemaining(loan){ return Math.max(0,Math.round(((Number(loan.amount)||0)-atomeLoanPaid(loan))*100)/100); }
function reconcileCreditPurchaseLoans(){
  let loansChanged=false,transactionsChanged=false;
  const loansById=new Map(state.atomeLoans.map(loan=>[loan.id,loan]));
  state.wallets.filter(isAtomeWallet).forEach(wallet=>{
    state.transactions.filter(tx=>tx.walletId===wallet.id&&tx.type==='expense'&&!tx.atomeInstallmentFee&&!tx.atomeRepayment).forEach(tx=>{
      const linkedLoan=tx.atomeLoanId&&loansById.get(tx.atomeLoanId);
      if(linkedLoan?.walletId===wallet.id) return;
      const id=tx.atomeLoanId&&!linkedLoan?tx.atomeLoanId:uid();
      const loan={id,walletId:wallet.id,source:'card',amount:Number(tx.amount)||0,dueDate:'',transactionId:tx.id,payments:[],recovered:true};
      state.atomeLoans.push(loan);
      loansById.set(id,loan);
      tx.atomeLoanId=id;
      loansChanged=true;
      transactionsChanged=true;
    });
  });
  if(loansChanged) saveKey('atomeLoans',state.atomeLoans);
  if(transactionsChanged) saveKey('transactions',state.transactions);
}
function atomeLegacyDebt(walletId){
  const wallet=state.wallets.find(item=>item.id===walletId);
  const legacy=state.transactions.filter(tx=>tx.walletId===walletId&&!tx.atomeLoanId).reduce((sum,tx)=>sum+(tx.type==='income'?1:-1)*(Number(tx.amount)||0),Number(wallet?.initial)||0);
  return Math.max(0,Math.round(-legacy*100)/100);
}
function atomeOutstanding(walletId,source){
  const loans=state.atomeLoans.filter(loan=>loan.walletId===walletId&&(!source||loan.source===source)).reduce((sum,loan)=>sum+atomeLoanRemaining(loan),0);
  return Math.round((loans+(!source||source==='card'?atomeLegacyDebt(walletId):0))*100)/100;
}
function atomeAvailableLimit(wallet,source){
  const limit=Math.max(0,Number(wallet?.[source==='cash'?'cashLimit':'cardLimit'])||0);
  return Math.max(0,Math.round((limit-atomeOutstanding(wallet?.id,source))*100)/100);
}
function walletAvailableBalance(walletId){
  const w = state.wallets.find(x=>x.id===walletId);
  if(!w) return 0;
  if(isAtomeWallet(w)) return -atomeOutstanding(walletId);
  let bal = w.initial || 0;
  state.transactions.forEach(t=>{
    if(t.walletId!==walletId) return;
    bal += t.type==='income' ? t.amount : t.type==='transfer' ? (t.transferDirection==='in'?t.amount:-t.amount) : -t.amount;
  });
  return Math.round(bal * 100) / 100;
}
function walletSavedBalance(walletId){
  return Math.round(state.transactions.reduce((sum,tx)=>{
    if(tx.walletId!==walletId||tx.type!=='expense'||!tx.note?.includes('[goal:')) return sum;
    return tx.note.match(/\[goal:[^\]]+\]/)?sum+(Number(tx.amount)||0):sum;
  },0)*100)/100;
}
function totalBalance(){ return state.wallets.reduce((s,w)=>s+walletBalance(w.id),0); }
function txInScope(walletFilter){
  return state.transactions.filter(t=> walletFilter==='all' ? true : t.walletId===walletFilter);
}
function monthSum(type, ym, walletFilter='all'){
  return txInScope(walletFilter).filter(t=>t.type===type && !t.atomeRepayment && t.date.slice(0,7)===ym).reduce((s,t)=>s+t.amount,0);
}
function catById(id){ return state.categories.find(c=>c.id===id); }
function walletById(id){ return state.wallets.find(w=>w.id===id); }
function currentYM(){ return todayStr().slice(0,7); }
function last6Months(){
  const arr=[]; const d = new Date();
  for(let i=5;i>=0;i--){
    const dt = new Date(d.getFullYear(), d.getMonth()-i, 1);
    arr.push(dt.toISOString().slice(0,7));
  }
  return arr;
}
