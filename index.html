function walletIconType(wallet){
  if(wallet.icon==='bank' && BANK_LOGOS.some(type=>type.id===wallet.bankLogo)) return wallet.bankLogo;
  if(BANK_LOGOS.some(type=>type.id===wallet.icon)) return wallet.icon;
  const known = WALLET_TYPES.some(type=>type.id===wallet.icon)||OTHER_WALLET_ICONS.some(type=>type.id===wallet.icon);
  if(known) return wallet.icon;
  const name = (wallet.name||'').toLowerCase().replace(/\s+/g,'');
  if(name.includes('gcash')) return 'gcash';
  if(name.includes('bpi')) return 'bpi';
  if(name.includes('bdo')) return 'bdo';
  if(name.includes('gotyme') || name.includes('goty')) return 'gotyme';
  if(name.includes('paypal')) return 'paypal';
  if(name.includes('atome')) return 'atome';
  if(name.includes('tiktokpaylater')||name.includes('tiktok')) return 'tiktok-paylater';
  if(name.includes('shopeepaylater')||name.includes('shopee')) return 'shopee-paylater';
  if(name.includes('cash')) return 'cash';
  return 'bank';
}

  const type = walletIconType(wallet);

  if(type==='bank') icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-5 9 5M4 10h16M5 10v8m4-8v8m6-8v8m4-8v8M3 20h18"/></svg>';
  if(type==='other') icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><path d="M4 5h16M4 19h16"/></svg>';

  if(type==='savings') icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10h14v10H5zM3 10l9-6 9 6M9 14v3m6-3v3"/><path d="M12 8v.01"/></svg>';

  if(type==='atome') icon = '<img class="wallet-logo atome" src="/assets/atome-ph-app-icon.jpg" alt="">';
  return `<span class="wallet-icon ${type} ${extraClass}" role="img" aria-label="${esc(def.name)}">${icon}</span>`;

function receiptRowHTML(t){

  const w = walletById(t.walletId);
  const note=String(t.note||'').replace(/\[goal:[^\]]+\]/g,'').replace(/\s*\(scheduled \d{4}-\d{2}-\d{2}\)/g,'').trim();

function goalDateValue(value){return value ? new Date(`${value}T00:00:00`) : null;}
function goalShortDate(value){const date=goalDateValue(value);return date?date.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';}
function goalUsesWeeklyDeposits(g){return Boolean(g?.weekDays?.length&&(g.splitWeekly||(g.cycle==='week')));}
function goalDateString(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}
function addGoalMonths(date,months,anchorDay=date.getDate()){
  const result=new Date(date);
  result.setDate(1);
  result.setMonth(result.getMonth()+months);
  result.setDate(Math.min(anchorDay,new Date(result.getFullYear(),result.getMonth()+1,0).getDate()));
  return result;
}
function nextGoalDueDate(g,afterValue){
  const after=goalDateValue(afterValue)||new Date();
  const weeklySchedule=goalUsesWeeklyDeposits(g);
  const interval=weeklySchedule||g.cycle==='month'?1:Math.max(1,parseInt(g.cycleCount,10)||1);
  if(weeklySchedule){
    const start=goalDateValue(g.startDate)||after;
    const cleared=new Set((g.clearedDeposits||[]).map(item=>typeof item==='string'?item:item.date));
    const cursor=new Date(after);
    for(let i=0;i<3660;i++){
      cursor.setDate(cursor.getDate()+1);
      const dayOffset=Math.floor((Date.UTC(cursor.getFullYear(),cursor.getMonth(),cursor.getDate())-Date.UTC(start.getFullYear(),start.getMonth(),start.getDate()))/86400000);
      const cursorValue=goalDateString(cursor);
      if(dayOffset>0&&goalIsScheduledWeekday(g,cursorValue)&&!cleared.has(cursorValue)) return new Date(cursor);
    }
    return null;
  }
  if(g.cycle==='month'){
    const anchor=goalDateValue(g.startDate)||after;
    for(let month=interval;month<=1200*interval;month+=interval){
      const due=addGoalMonths(anchor,month,anchor.getDate());
      if(due>after) return due;
    }
    return null;
  }
  if(g.cycle==='day'){
    const next=new Date(after); next.setDate(next.getDate()+interval); return next;
  }
  const next=new Date(after); next.setDate(next.getDate()+7*interval); return next;
}
function goalScheduleRows(g,remaining){
  const deposit=Number(g.deposit)||0;
  const weeklySelected=goalUsesWeeklyDeposits(g);
  if(g.type!=='periodic' || (!deposit&&!weeklySelected) || (!weeklySelected&&remaining<=0)) return '';
  const groups=new Map();
  const getGroup=(date)=>{
    const monthKey=date.slice(0,7);
    if(!groups.has(monthKey)){
      const monthDate=goalDateValue(`${monthKey}-01`);
      groups.set(monthKey,{monthKey,month:monthDate.toLocaleDateString('en-US',{month:'long',year:'numeric'}),rows:[]});
    }
    return groups.get(monthKey);
  };
  const dueStatus=(date)=>date<goalDateString(new Date())?' is-missed':date===goalDateString(new Date())?' is-due':'';
  const completed=new Map((Array.isArray(g.depositHistory)?g.depositHistory:[]).map(item=>[item.date,item.amount]));
  const completedWallets=new Map((Array.isArray(g.depositHistory)?g.depositHistory:[]).map(item=>[item.date,item.walletId]));
  state.transactions.forEach(tx=>{
    if(!tx.note?.includes(`[goal:${g.id}]`)) return;
    const scheduled=tx.note.match(/\(scheduled (\d{4}-\d{2}-\d{2})\)/)?.[1];
    if(scheduled&&!completed.has(scheduled)) completed.set(scheduled,Number(tx.amount)||0);

  });

      const due=goalDateValue(date);
      if(!due||date<(g.startDate||'')||(g.targetDate&&date>=g.targetDate)) return;
      const walletName=state.wallets.find(wallet=>wallet.id===completedWallets.get(date))?.name;
      const walletLabel=walletName?` from ${esc(walletName)}`:'';
      getGroup(date).rows.push(`<div class="goal-schedule-row is-complete" role="button" tabindex="0" aria-label="Edit ${fmt(amount)} deposit from ${esc(walletName||'wallet')} on ${due.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}" onclick="openGoalDepositModal('${g.id}','${date}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openGoalDepositModal('${g.id}','${date}');}"><span class="goal-schedule-mark" aria-hidden="true">✓</span><span class="goal-schedule-date">${due.toLocaleDateString('en-US',{weekday:'short',month:'2-digit',day:'2-digit',year:'numeric'})}</span><span class="goal-schedule-amount">${fmt(amount)}<small>Added${walletLabel} · Edit</small></span></div>`);
    });
    (Array.isArray(g.clearedDeposits)?g.clearedDeposits:[]).forEach(item=>{
      const date=typeof item==='string'?item:item.date;
      const amount=goalClearedDepositAmount(g,item);
      const due=goalDateValue(date);
      if(!due||completed.has(date)||date<(g.startDate||'')||(g.targetDate&&date>=g.targetDate)) return;
      getGroup(date).rows.push(`<div class="goal-schedule-row is-cleared${dueStatus(date)}" role="button" tabindex="0" aria-label="Add ${fmt(amount)} savings from a wallet for ${due.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}" onclick="openContributeModal('${g.id}','${date}',${amount})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openContributeModal('${g.id}','${date}',${amount});}"><span class="goal-schedule-mark" aria-hidden="true">${goalIconSvg('wallet')}</span><span class="goal-schedule-date">${due.toLocaleDateString('en-US',{weekday:'short',month:'2-digit',day:'2-digit',year:'numeric'})}</span><span class="goal-schedule-amount">${fmt(amount)}<small>To save · Add funds</small></span></div>`);
    });
  }
  let after=g.lastContribution||g.startDate||todayStr();
  let left=remaining;
  let simulatedMonth='';
  let simulatedMonthAmount=0;
  const target=goalDateValue(g.targetDate);
  for(let i=0;i<48 && left>0;i++){
    const due=nextGoalDueDate(g,after);
    const weeklySelected=goalUsesWeeklyDeposits(g);
    if(!due || (target && (weeklySelected?due>=target:due>target))) break;
    const dueValue=goalDateString(due);
    const dueMonth=dueValue.slice(0,7);
    if(dueMonth!==simulatedMonth){
      simulatedMonth=dueMonth;
      simulatedMonthAmount=(Array.isArray(g.clearedDeposits)?g.clearedDeposits:[]).reduce((sum,item)=>{
        const clearedDate=typeof item==='string'?item:item.date;
        if(clearedDate?.slice(0,7)!==dueMonth) return sum;
        return sum+goalClearedDepositAmount(g,item);
      },0);
    }
    const amount=weeklySelected?goalWeeklyInstallment(g,dueValue,simulatedMonthAmount):Math.min(deposit,Math.round(left*100)/100);
    if(amount<=0){after=dueValue;continue;}
    getGroup(dueValue).rows.push(`<div class="goal-schedule-row${dueStatus(dueValue)}" role="button" tabindex="0" aria-label="Add ${fmt(amount)} savings from a wallet for ${due.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}" onclick="openContributeModal('${g.id}','${dueValue}',${amount})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openContributeModal('${g.id}','${dueValue}',${amount});}"><span class="goal-schedule-mark">${goalIconSvg('wallet')}</span><span class="goal-schedule-date">${due.toLocaleDateString('en-US',{weekday:'short',month:'2-digit',day:'2-digit',year:'numeric'})}</span><span class="goal-schedule-amount">${fmt(amount)}<small>To save · Add funds</small></span></div>`);
    simulatedMonthAmount=Math.round((simulatedMonthAmount+amount)*100)/100;
    left=Math.round((left-amount)*100)/100;
    after=dueValue;

  const orderedGroups=[...groups.values()].sort((a,b)=>a.monthKey.localeCompare(b.monthKey));
  if(!weeklySelected) return orderedGroups.flatMap(group=>group.rows).join('')+(left>0?`<div class="goal-schedule-empty">More deposits are needed to reach the goal.</div>`:'');
  const groupedRows=orderedGroups.map((group,index)=>`<details class="goal-schedule-month" ${index===0?'open':''}><summary class="goal-schedule-month-head"><strong>${group.month}</strong><span>${fmt(goalWeeklyMonthlyTarget(g))} / month</span></summary><div class="goal-schedule-month-rows">${group.rows.join('')}</div></details>`).join('');
  return groupedRows+(left>0?`<div class="goal-schedule-empty">More deposits are needed to reach the goal.</div>`:'');

function goalFreeSavingsHistory(g){
  const contributions=state.transactions
    .filter(tx=>tx.type==='expense'&&tx.note?.includes(`[goal:${g.id}]`))
    .map(tx=>({transactionId:tx.id,date:tx.date,amount:Number(tx.amount)||0,walletId:tx.walletId}))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const recorded=contributions.reduce((sum,item)=>sum+item.amount,0);
  const initial=Math.max(0,Math.round(((Number(g.current)||0)-recorded)*100)/100);
  if(initial>0) contributions.push({date:g.startDate,amount:initial,initial:true});
  const rows=contributions.map(item=>{
    const date=goalDateValue(item.date);
    const dateLabel=date?date.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'Date unavailable';
    const walletName=item.initial?'Initial balance':(state.wallets.find(wallet=>wallet.id===item.walletId)?.name||'Wallet unavailable');
    const editable=!item.initial&&item.transactionId;
    const interactive=editable?` role="button" tabindex="0" aria-label="Edit ${fmt(item.amount)} saved from ${esc(walletName)} on ${dateLabel}" onclick="openFreeGoalContributionModal('${g.id}','${item.transactionId}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openFreeGoalContributionModal('${g.id}','${item.transactionId}');}"`:'';

  }).join('');
  return `<section class="goal-schedule"><div class="goal-schedule-head"><h4>Saved funds</h4></div><div class="goal-schedule-list">${rows||'<div class="goal-schedule-empty">No funds added yet. Add savings to see them here.</div>'}</div></section>`;

  const maxAmount=Math.max(0,Math.round((Number(g.target)-Number(g.current)+amount)*100)/100);
  const date=goalDateValue(tx.date);
  const dateLabel=date?.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})||'Date unavailable';
  openModal(`<div class="modal-head"><h3>Edit saved funds</h3><button class="modal-close" aria-label="Close contribution editor" onclick="closeModal()">&times;</button></div><form id="free-goal-contribution-form"><div class="goal-detail-type" style="margin:-4px 0 16px;">${esc(g.name)} · ${dateLabel}</div><div class="field"><label for="free-goal-amount">Amount (₱)</label><input id="free-goal-amount" type="number" min="0.01" max="${maxAmount.toFixed(2)}" step="0.01" required value="${amount.toFixed(2)}"></div><div class="field"><label for="free-goal-wallet">From wallet</label>${transactionWalletPickerHTML(state.wallets,tx.walletId,'free-goal-wallet')}</div><div class="modal-actions"><button type="button" class="btn danger" onclick="undoFreeGoalContribution('${g.id}','${tx.id}')">Undo deposit</button><button type="submit" class="btn">Save changes</button></div></form>`);
  document.getElementById('free-goal-contribution-form').onsubmit=event=>{
    event.preventDefault();
    const nextAmount=Number(document.getElementById('free-goal-amount').value);
    const nextWalletId=document.getElementById('free-goal-wallet').value;
    if(!Number.isFinite(nextAmount)||nextAmount<=0||nextAmount>maxAmount||!nextWalletId) return;
    const availableForDeposit=walletAvailableBalance(nextWalletId)+(nextWalletId===tx.walletId?amount:0);
    if(nextAmount>availableForDeposit){alert(`Not enough available in this wallet. Available for this deposit: ${fmt(availableForDeposit)}.`);return;}
    g.current=Math.max(0,Math.round(((Number(g.current)||0)+nextAmount-amount)*100)/100);
    tx.amount=nextAmount;
    tx.walletId=nextWalletId;
    saveKey('transactions',state.transactions);
    saveKey('goals',state.goals);
    closeAllModals();render();openGoalDetails(goalId);
  };
}
function undoFreeGoalContribution(goalId,transactionId){
  const g=state.goals.find(goal=>goal.id===goalId);
  const tx=state.transactions.find(transaction=>transaction.id===transactionId&&transaction.note?.includes(`[goal:${goalId}]`));
  if(!g||!tx) return;
  const amount=Number(tx.amount)||0;
  if(!confirm(`Undo the ${fmt(amount)} saved on ${goalDateValue(tx.date)?.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})||'this date'}? This will reduce the goal balance and restore the wallet balance.`)) return;
  state.transactions=state.transactions.filter(transaction=>transaction.id!==transactionId);
  g.current=Math.max(0,Math.round(((Number(g.current)||0)-amount)*100)/100);
  saveKey('transactions',state.transactions);
  saveKey('goals',state.goals);
  closeAllModals();render();openGoalDetails(goalId);
}

/* ---------- Charts ---------- */
function donutChart(data){
  if(!data.length) return `<div class="empty">No expenses recorded this month.</div>`;
  const total = data.reduce((s,d)=>s+d.value,0);
  const r=54, cx=70, cy=70, circumference = 2*Math.PI*r;
  let offset=0;
  const segs = data.map(d=>{
    const frac = d.value/total;
    const len = frac*circumference;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="18" stroke-dasharray="${len} ${circumference-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
    offset += len;
    return seg;
  }).join('');
  const legend = data.slice(0,6).map(d=>`<div class="legend-item"><span class="legend-dot" style="background:${d.color}"></span>${esc(d.label)} <span class="amt">${fmt(d.value)}</span></div>`).join('');
  return `<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;"><svg width="140" height="140" viewBox="0 0 140 140">${segs}<text x="70" y="66" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="var(--ink-soft)">Total</text><text x="70" y="82" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" fill="var(--ink)">${fmt(total)}</text></svg><div style="flex:1;min-width:150px;">${legend}</div></div>`;
}
function barChart(trend){
  const max = Math.max(1, ...trend.flatMap(t=>[t.income,t.expense]));
  const w=48, gap=22, chartH=140, baseY=150;
  const svgW = trend.length*(w*2+gap)+20;
  let bars = '';
  trend.forEach((t,i)=>{
    const x0 = 10 + i*(w*2+gap);
    const hInc = (t.income/max)*chartH;
    const hExp = (t.expense/max)*chartH;
    bars += `<rect x="${x0}" y="${baseY-hInc}" width="${w-6}" height="${hInc}" rx="4" fill="var(--income)"/>`;
    bars += `<rect x="${x0+w-2}" y="${baseY-hExp}" width="${w-6}" height="${hExp}" rx="4" fill="var(--expense)"/>`;
    bars += `<text x="${x0+w-4}" y="${baseY+16}" text-anchor="middle" font-family="Inter" font-size="10.5" fill="var(--ink-faint)">${monthLabel(t.m)}</text>`;
  });
  return `<svg width="100%" height="176" viewBox="0 0 ${svgW} 176" preserveAspectRatio="xMidYMid meet">${bars}</svg><div class="chart-legend"><div class="legend-item"><span class="legend-dot" style="background:var(--income)"></span>Income</div><div class="legend-item"><span class="legend-dot" style="background:var(--expense)"></span>Expense</div></div>`;
}

function deleteTx(id){
  if(!confirm('Delete this transaction?')) return;
  const transaction=state.transactions.find(item=>item.id===id);
  if(transaction?.atomeLoanId){
    const loan=state.atomeLoans.find(item=>item.id===transaction.atomeLoanId);
    if(loan&&atomeLoanPaid(loan)>0){alert('This credit loan already has payments. Keep its history and review it from its wallet.');return;}
    state.atomeLoans=state.atomeLoans.filter(item=>item.id!==transaction.atomeLoanId);
    state.transactions=state.transactions.filter(item=>item.atomeLoanId!==transaction.atomeLoanId);
    saveKey('atomeLoans',state.atomeLoans);
  }else state.transactions = state.transactions.filter(t=>t.id!==id);
  saveKey('transactions', state.transactions);
  render();
}

function deleteWallet(id){
  const hasTx = state.transactions.some(t=>t.walletId===id);
  if(state.wallets.length===1){ alert('You need at least one wallet.'); return; }
  if(!confirm(hasTx?'This wallet has transactions. Deleting will also delete those records. Continue?':'Delete this wallet?')) return;
  closeAllModals();
  const deletingAtome=isAtomeWallet(walletById(id));
  if(deletingAtome){
    const loanIds=new Set(state.atomeLoans.filter(loan=>loan.walletId===id).map(loan=>loan.id));
    state.transactions=state.transactions.filter(tx=>tx.walletId!==id&&!loanIds.has(tx.atomeLoanId));
    state.atomeLoans=state.atomeLoans.filter(loan=>loan.walletId!==id);
    saveKey('atomeLoans',state.atomeLoans);
  }else{
    const removedPayments=new Set(state.transactions.filter(tx=>tx.walletId===id&&tx.atomeRepayment).map(tx=>tx.paymentId));
    if(removedPayments.size){
      state.atomeLoans=state.atomeLoans.map(loan=>({...loan,payments:(loan.payments||[]).filter(payment=>!removedPayments.has(payment.id))}));
      saveKey('atomeLoans',state.atomeLoans);
    }
    state.transactions = state.transactions.filter(t=>t.walletId!==id);
  }
  state.wallets = state.wallets.filter(w=>w.id!==id);
  saveKey('wallets', state.wallets); saveKey('transactions', state.transactions);
  render();
}
window.deleteWallet = deleteWallet;
function walletGoalSavingsChartHTML(walletId,savedTotal){
  const palette=['#6f1715','#b5833a','#4b8665','#c76855','#8c668e','#4d8292','#d49d45','#75884c'];
  const totals=new Map();
  state.transactions.forEach(tx=>{
    if(tx.walletId!==walletId||tx.type!=='expense') return;
    const goalId=tx.note?.match(/\[goal:([^\]]+)\]/)?.[1];
    if(!goalId) return;
    totals.set(goalId,(totals.get(goalId)||0)+(Number(tx.amount)||0));
  });
  const entries=[...totals.entries()].map(([id,amount],index)=>({
    id,amount,name:state.goals.find(goal=>goal.id===id)?.name||'Other goal',color:palette[index%palette.length]
  })).filter(entry=>entry.amount>0).sort((a,b)=>b.amount-a.amount);
  let cursor=0;
  const stops=entries.map(entry=>{
    const start=cursor;
    cursor+=entry.amount/Math.max(savedTotal,0.01)*100;
    return `${entry.color} ${start}% ${Math.min(cursor,100)}%`;

function renderGoals(){
  const totalSaved = state.goals.reduce((sum,g)=>sum+(Number(g.current)||0),0);
  const totalTarget = state.goals.reduce((sum,g)=>sum+(Number(g.target)||0),0);
  const overallPct = totalTarget ? Math.min(100,Math.round(totalSaved/totalTarget*100)) : 0;
  const totalRemaining=Math.max(0,Math.round((totalTarget-totalSaved)*100)/100);
  const today=goalDateValue(todayStr());
  const weekStart=new Date(today);
  weekStart.setDate(weekStart.getDate()-((weekStart.getDay()+6)%7));
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+6);
  let weekPlanned=0,weekAdded=0;
  state.goals.filter(g=>g.type==='periodic'&&goalUsesWeeklyDeposits(g)).forEach(g=>{
    const completed=new Map((Array.isArray(g.depositHistory)?g.depositHistory:[]).map(item=>[item.date,Number(item.amount)||0]));
    state.transactions.forEach(tx=>{
      if(!tx.note?.includes(`[goal:${g.id}]`)) return;
      const scheduled=tx.note.match(/\(scheduled (\d{4}-\d{2}-\d{2})\)/)?.[1];
      if(scheduled&&!completed.has(scheduled)) completed.set(scheduled,Number(tx.amount)||0);
    });
    const selected=new Set(g.weekDays||[]);
    let simulatedMonth='',simulatedAmount=0;
    for(let date=new Date(weekStart);date<=weekEnd;date.setDate(date.getDate()+1)){
      const dateValue=goalDateString(date);
      if(dateValue<(g.startDate||'')||(g.targetDate&&dateValue>=g.targetDate)||!selected.has(DAYS[date.getDay()])||!goalIsScheduledWeekday(g,dateValue)) continue;
      const month=dateValue.slice(0,7);
      if(month!==simulatedMonth){simulatedMonth=month;simulatedAmount=0;}
      const completedAmount=completed.get(dateValue);
      const amount=completedAmount??goalWeeklyInstallment(g,dateValue,simulatedAmount);
      if(amount<=0) continue;
      weekPlanned+=amount;
      if(completedAmount!==undefined) weekAdded+=completedAmount;
      else simulatedAmount=Math.round((simulatedAmount+amount)*100)/100;
    }
  });
  weekPlanned=Math.round(weekPlanned*100)/100;
  weekAdded=Math.round(weekAdded*100)/100;
  const weekRemaining=Math.max(0,Math.round((weekPlanned-weekAdded)*100)/100);
  const weekRange=`${weekStart.toLocaleDateString('en-US',{month:'short',day:'numeric'})}–${weekEnd.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
  const monthStart=new Date(today.getFullYear(),today.getMonth(),1);
  const monthEnd=new Date(today.getFullYear(),today.getMonth()+1,0);
  const monthKey=goalDateString(monthStart).slice(0,7);
  let monthPlanned=0,monthAdded=0,activeMonthlyPlans=0;
  state.goals.filter(g=>g.type==='periodic'&&goalUsesWeeklyDeposits(g)).forEach(g=>{
    const start=goalDateValue(g.startDate)||monthStart;
    start.setDate(start.getDate()+1);
    const end=g.targetDate?goalDateValue(g.targetDate):monthEnd;
    if(g.targetDate) end.setDate(end.getDate()-1);
    const rangeStart=start>monthStart?start:monthStart;
    const rangeEnd=end<monthEnd?end:monthEnd;
    const cycles=rangeStart<=rangeEnd?countGoalWeekdaysInRange(goalDateString(rangeStart),goalDateString(rangeEnd),g.weekDays||[],goalWeekCycleLimit(g)):0;
    if(!cycles) return;
    activeMonthlyPlans++;
    monthPlanned+=goalWeeklyMonthlyTarget(g);

    ${state.goals.length?`<div class="goal-plan-heading">Savings plan</div><div class="goal-summary"><div class="card goal-summary-item goal-weekly-summary"><div class="goal-weekly-summary-head"><div class="k">Weekly balance</div><span class="goal-weekly-summary-date">${weekRange}</span></div><div class="goal-weekly-summary-value"><div class="v">${weekPlanned?fmt(weekRemaining):'No deposits due'}</div><span class="goal-weekly-summary-state">${weekPlanned?(weekRemaining?'Left this week':'Complete for this week'):'Weekly plan'}</span></div><div class="goal-week-balance-note">${weekPlanned?`${fmt(weekAdded)} added of ${fmt(weekPlanned)} scheduled`:'Scheduled weekly deposits will appear here.'}</div></div>${monthlySummary}</div>`:''}

function initModalDatePickers(overlay){
  const inputs=[...overlay.querySelectorAll('.modal input[type="date"]')];
  if(!inputs.length)return;
  inputs.forEach(input=>{
    const label=input.labels?.[0]?.textContent?.trim()||'Choose date';
    input.dataset.dateLabel=label;
    const wasReadOnly=input.readOnly;
    input.dataset.datePickerLocked=String(wasReadOnly);
    const trigger=document.createElement('button');
    trigger.type='button';trigger.className='date-picker-trigger';trigger.id=`${input.id||'date'}-picker-trigger`;
    trigger.setAttribute('aria-label',`${wasReadOnly?'Calculated':'Choose'} ${label.toLowerCase()}`);
    const value=document.createElement('span');value.className='date-picker-trigger-value';
    const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('fill','none');icon.setAttribute('stroke','currentColor');icon.setAttribute('stroke-width','1.8');icon.setAttribute('stroke-linecap','round');icon.setAttribute('stroke-linejoin','round');icon.setAttribute('aria-hidden','true');
    icon.innerHTML='<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path>';
    trigger.append(value,icon);
    const control=document.createElement('div');control.className='date-picker-control';
    input.parentNode.insertBefore(control,input);control.append(trigger,input);
    input.classList.add('date-picker-native');input.readOnly=true;input.tabIndex=-1;input.setAttribute('aria-hidden','true');
    const labelElement=overlay.querySelector(`label[for="${CSS.escape(input.id)}"]`);if(labelElement)labelElement.htmlFor=trigger.id;
    trigger.addEventListener('click',()=>{if(input.dataset.datePickerLocked!=='true')openFor(input,trigger);});
    input.addEventListener('input',()=>updateDatePickerDisplay(input));
    input.addEventListener('change',()=>updateDatePickerDisplay(input));
    updateDatePickerDisplay(input);
  });
  const layer=document.createElement('div');
  layer.className='date-picker-layer';
  layer.hidden=true;
  layer.tabIndex=-1;
  layer.innerHTML='<section class="date-picker-card" role="dialog" aria-modal="true" aria-label="Choose date"></section>';
  overlay.appendChild(layer);
  const card=layer.querySelector('.date-picker-card');
  let activeInput=null,activeTrigger=null,shownMonth=new Date();
  const asDate=value=>value?new Date(`${value}T00:00:00`):null;
  const dateValue=date=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  const isAllowed=value=>(!activeInput.min||value>=activeInput.min)&&(!activeInput.max||value<=activeInput.max);
  function openFor(input,trigger){activeInput=input;activeTrigger=trigger;shownMonth=asDate(input.value)||new Date();layer.hidden=false;render();layer.focus();}
  function render(){
    if(!activeInput)return;
    const year=shownMonth.getFullYear(),month=shownMonth.getMonth();
    const first=new Date(year,month,1),daysInMonth=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7;
    const selected=activeInput.value,today=todayStr(),label=activeInput.dataset.dateLabel||'date';
    const blank=Array.from({length:offset},()=>'<span aria-hidden="true"></span>').join('');
    const days=Array.from({length:daysInMonth},(_,index)=>{
      const date=new Date(year,month,index+1),value=dateValue(date),disabled=!isAllowed(value);
      return `<button type="button" class="date-picker-day ${value===selected?'selected ':''}${value===today?'today':''}" data-date-value="${value}" aria-label="${date.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}" aria-pressed="${value===selected}" ${disabled?'disabled':''}>${index+1}</button>`;
    }).join('');
    card.setAttribute('aria-label',`Choose ${label}`);
    card.innerHTML=`<header class="date-picker-head"><div class="date-picker-month">${shownMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><div class="date-picker-nav"><button type="button" data-month-step="-1" aria-label="Previous month">‹</button><button type="button" data-month-step="1" aria-label="Next month">›</button><button type="button" class="date-picker-close" data-date-action="close" aria-label="Close date picker">×</button></div></header><div class="date-picker-weekdays" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div class="date-picker-days">${blank}${days}</div><footer class="date-picker-footer">${activeInput.required?'':`<button type="button" data-date-action="clear">Clear date</button>`}<button type="button" class="date-picker-today" data-date-action="today" ${isAllowed(today)?'':'disabled'}>Today</button></footer>`;
  }
  function close(){layer.hidden=true;const trigger=activeTrigger;activeInput=null;activeTrigger=null;trigger?.focus();}
  layer.addEventListener('click',event=>{
    event.stopPropagation();
    const button=event.target.closest('button');
    if(!button)return;
    if(button.dataset.monthStep){shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()+Number(button.dataset.monthStep),1);render();return;}
    if(button.dataset.dateValue){
      activeInput.value=button.dataset.dateValue;
      activeInput.dispatchEvent(new Event('input',{bubbles:true}));
      activeInput.dispatchEvent(new Event('change',{bubbles:true}));
      close();return;
    }
    if(button.dataset.dateAction==='today'){
      activeInput.value=todayStr();activeInput.dispatchEvent(new Event('input',{bubbles:true}));activeInput.dispatchEvent(new Event('change',{bubbles:true}));close();return;
    }
    if(button.dataset.dateAction==='clear'){
      activeInput.value='';activeInput.dispatchEvent(new Event('input',{bubbles:true}));activeInput.dispatchEvent(new Event('change',{bubbles:true}));close();return;
    }
    if(button.dataset.dateAction==='close')close();
  });
  layer.addEventListener('keydown',event=>{if(event.key==='Escape'){event.stopPropagation();close();}});
  layer.addEventListener('click',event=>{if(event.target===layer){close();}});
}
function updateDatePickerDisplay(input){
  const valueNode=input.closest('.date-picker-control')?.querySelector('.date-picker-trigger-value');
  const trigger=input.closest('.date-picker-control')?.querySelector('.date-picker-trigger');
  if(!valueNode||!trigger)return;
  const date=input.value?new Date(`${input.value}T00:00:00`):null;
  valueNode.textContent=date&&!Number.isNaN(date.getTime())?date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'Choose a date';
  valueNode.classList.toggle('date-picker-trigger-placeholder',!input.value);
  const calculated=input.dataset.datePickerLocked==='true';
  trigger.disabled=calculated;
  trigger.setAttribute('aria-label',`${calculated?'Calculated':'Choose'} ${input.dataset.dateLabel?.toLowerCase()||'date'}${input.value?`: ${valueNode.textContent}`:''}`);
  input.closest('.date-picker-control')?.setAttribute('aria-disabled',String(calculated));
}
function openModal(html){
  const wrap = document.createElement('div');

      <div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Transfer</button></div>
    </form>
  `);
  document.getElementById('transfer-form').onsubmit = (e)=>{
    e.preventDefault();
    const fromId = document.getElementById('tf-from').value;
    const toId = document.getElementById('tf-to').value;
    const amount = parseFloat(document.getElementById('tf-amount').value);
    const note = document.getElementById('tf-note').value.trim();
    if(!amount || amount<=0){ alert('Enter a valid amount.'); return; }
    if(fromId === toId){ alert('Cannot transfer to the same wallet.'); return; }

    if(amount > fromBal){ alert(`Insufficient balance in source wallet. Available: ${fmt(fromBal)}`); return; }
    const transferCat = state.categories.find(c=>c.id==='c-transfer');
    if(!transferCat){
      state.categories.push({id:'c-transfer', name:'Transfer', type:'expense', color:'#B5833A'});
      saveKey('categories', state.categories);
    }
    const date = todayStr();
    const noteFrom = note ? `Transfer to ${walletById(toId)?.name}: ${note}` : `Transfer to ${walletById(toId)?.name}`;
    const noteTo = note ? `Transfer from ${walletById(fromId)?.name}: ${note}` : `Transfer from ${walletById(fromId)?.name}`;
    state.transactions.push({id:uid(), amount, walletId:fromId, categoryId:'c-transfer', date, note:noteFrom, type:'expense'});

  };

/* --- Goal modal with day selection for weekly cycle --- */
function countGoalDepositCycles(startValue,endValue,cycle,cycleCount,weekDays=[]){
  const start = new Date(`${startValue}T00:00:00`);
  const end = new Date(`${endValue}T00:00:00`);
  if(Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || end<=start) return 0;
  const interval = Math.max(1,parseInt(cycleCount,10)||1);
  const dayMs = 86400000;
  const startUtc = Date.UTC(start.getFullYear(),start.getMonth(),start.getDate());
  const endUtc = Date.UTC(end.getFullYear(),end.getMonth(),end.getDate());
  const dayDiff = Math.floor((endUtc-startUtc)/dayMs);
  if(cycle==='day') return Math.floor(dayDiff/interval);
  if(cycle==='week' && weekDays.length){
    const first=new Date(start);first.setDate(first.getDate()+1);
    const last=new Date(end);last.setDate(last.getDate()-1);
    return countGoalWeekdaysInRange(goalDateString(first),goalDateString(last),weekDays,interval,startValue);
  }
  if(cycle==='week') return Math.floor(dayDiff/(7*interval));
  if(cycle==='month'){
    let count = 0;
    for(let n=interval;n<=1200*interval;n+=interval){
      const due = new Date(start);
      const day = due.getDate();
      due.setDate(1);
      due.setMonth(due.getMonth()+n);
      const lastDay = new Date(due.getFullYear(),due.getMonth()+1,0).getDate();
      due.setDate(Math.min(day,lastDay));
      if(due>end) break;
      count++;
    }
    return count;
  }
  return 0;
}

function countGoalWeekdaysInRange(startValue,endValue,weekDays,cycleLimit=Infinity){
  const start=goalDateValue(startValue), end=goalDateValue(endValue);
  if(!start||!end||end<start||!weekDays?.length) return 0;
  const selected=new Set(weekDays);
  const limit=Number.isFinite(Number(cycleLimit))?Math.max(1,parseInt(cycleLimit,10)||1):Infinity;
  let count=0;
  for(const cursor=new Date(start);cursor<=end;cursor.setDate(cursor.getDate()+1)){
    const weekNumber=Math.ceil(cursor.getDate()/7);
    if(weekNumber<=limit&&selected.has(DAYS[cursor.getDay()])) count++;
  }
  return count;
}
function goalWeekCycleLimit(g){return g?.cycle==='week'?Math.max(1,parseInt(g.cycleCount,10)||1):Infinity;}
function goalIsScheduledWeekday(g,dateValue){
  const date=goalDateValue(dateValue),start=goalDateValue(g?.startDate);
  if(!date||!start||date<=start||!g?.weekDays?.includes(DAYS[date.getDay()])) return false;
  return Math.ceil(date.getDate()/7)<=goalWeekCycleLimit(g);
}
function goalMonthlyBudget(target,current,start,end,cycleCount=1){
  const months=Math.max(1,countGoalDepositCycles(start,end,'month',cycleCount,[]));
  return Math.ceil((Math.max(0,Number(target)-Number(current))/months)*100)/100;
}
function goalWeeklyMonthlyTarget(g){
  if(g.splitWeekly&&g.cycle==='month'&&Number(g.deposit)>0) return Number(g.deposit);
  if(Number(g.monthlyDeposit)>0) return Number(g.monthlyDeposit);
  const months=Math.max(1,countGoalDepositCycles(g.startDate,g.targetDate,'month',1,[]));
  return Math.ceil((Number(g.target||0)/months)*100)/100;
}
function goalClearedDepositAmount(g,item){
  const stored=Number(typeof item==='string'?0:item?.amount)||0;
  if(stored>0) return stored;
  const value=typeof item==='string'?item:item?.date;
  const due=goalDateValue(value);
  if(!due||!g.weekDays?.length) return 0;
  const monthStart=new Date(due.getFullYear(),due.getMonth(),1);
  const monthEnd=new Date(due.getFullYear(),due.getMonth()+1,0);
  const goalStart=goalDateValue(g.startDate)||monthStart;
  const goalEnd=goalDateValue(g.targetDate)||monthEnd;
  if(g.targetDate) goalEnd.setDate(goalEnd.getDate()-1);
  const rangeStart=goalStart>monthStart?goalStart:monthStart;
  const rangeEnd=monthEnd<goalEnd?monthEnd:goalEnd;
  const cycles=countGoalWeekdaysInRange(goalDateString(rangeStart),goalDateString(rangeEnd),g.weekDays,goalWeekCycleLimit(g));
  return cycles?Math.ceil((goalWeeklyMonthlyTarget(g)/cycles)*100)/100:0;
}
function goalMonthSaved(g,monthKey){
  if(g.monthlySavedMonth===monthKey) return Number(g.monthlySavedAmount)||0;
  const tagged=`[goal:${g.id}]`;
  return state.transactions.filter(tx=>{
    const scheduledMonth=tx.note?.match(/\(scheduled (\d{4}-\d{2}-\d{2})\)/)?.[1]?.slice(0,7);
    if(tx.type!=='expense'||(scheduledMonth||tx.date?.slice(0,7))!==monthKey) return false;
    if(tx.note?.includes(tagged)) return true;
    return tx.note===`Contribution to: ${g.name}` || tx.note?.startsWith(`Periodic contribution to "${g.name}"`);
  }).reduce((sum,tx)=>sum+Number(tx.amount||0),0);
}
function goalWeeklyInstallment(g,dueValue,extraSaved=0){
  const due=goalDateValue(dueValue);
  if(!due||!g.weekDays?.length) return Number(g.deposit)||0;
  const monthStart=new Date(due.getFullYear(),due.getMonth(),1);
  const monthEnd=new Date(due.getFullYear(),due.getMonth()+1,0);
  const goalStart=goalDateValue(g.startDate)||monthStart;
  const goalEnd=goalDateValue(g.targetDate)||monthEnd;
  if(g.targetDate) goalEnd.setDate(goalEnd.getDate()-1);
  const rangeStart=goalStart>monthStart?goalStart:monthStart;
  const rangeEnd=monthEnd<goalEnd?monthEnd:goalEnd;
  const cycleLimit=goalWeekCycleLimit(g);
  const cycles=countGoalWeekdaysInRange(goalDateString(rangeStart),goalDateString(rangeEnd),g.weekDays,cycleLimit);
  if(!cycles||due<rangeStart||due>rangeEnd||!g.weekDays.includes(DAYS[due.getDay()])) return 0;
  const budget=goalWeeklyMonthlyTarget(g);
  const cycleNumber=countGoalWeekdaysInRange(goalDateString(rangeStart),goalDateString(due),g.weekDays,cycleLimit);
  if(!goalIsScheduledWeekday(g,dueValue)) return 0;
  const budgetCents=Math.max(0,Math.round(budget*100));
  const baseCents=Math.floor(budgetCents/cycles);
  const scheduledAmount=(baseCents+(cycleNumber<=budgetCents%cycles?1:0))/100;
  const saved=goalMonthSaved(g,dueValue.slice(0,7))+extraSaved;
  const monthLeft=Math.max(0,Math.round((budget-saved)*100)/100);
  const goalLeft=Math.max(0,Math.round((Number(g.target)-Number(g.current)-extraSaved)*100)/100);
  return Math.max(0,Math.min(scheduledAmount,monthLeft,goalLeft));
}
function nextGoalManualDueDate(g){
  const today=goalDateValue(todayStr());
  const last=goalDateValue(g.lastContribution||g.startDate);
  let after=new Date(today);
  after.setDate(after.getDate()-1);
  if(last&&last>=today) after=last;
  const due=nextGoalDueDate(g,goalDateString(after));
  return due?goalDateString(due):todayStr();
}
function addGoalMonthSaved(g,monthKey,amount){
  const previous=g.monthlySavedMonth===monthKey?(Number(g.monthlySavedAmount)||0):goalMonthSaved(g,monthKey);
  g.monthlySavedMonth=monthKey;
  g.monthlySavedAmount=Math.round((previous+amount)*100)/100;
}
function openGoalDepositModal(goalId,depositDate){
  const g=state.goals.find(goal=>goal.id===goalId);
  if(!g) return;
  const item=(Array.isArray(g.depositHistory)?g.depositHistory:[]).find(entry=>entry.date===depositDate);
  let tx=state.transactions.find(entry=>item?.transactionId&&entry.id===item.transactionId);
  if(!tx) tx=state.transactions.find(entry=>entry.type==='expense'&&entry.note?.includes(`[goal:${g.id}]`)&&entry.note.match(/\(scheduled (\d{4}-\d{2}-\d{2})\)/)?.[1]===depositDate);
  const amount=Number(item?.amount)||Number(tx?.amount)||0;
  const walletId=tx?.walletId||item?.walletId||state.wallets[0]?.id||'';
  const date=goalDateValue(depositDate);
  const dateLabel=date?.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric'})||depositDate;
  const maxAmount=Math.max(0,Math.round((Number(g.target)-Number(g.current)+amount)*100)/100);
  openModal(`<div class="modal-head"><h3>Edit weekly deposit</h3><button class="modal-close" aria-label="Close deposit editor" onclick="closeModal()">&times;</button></div><form id="goal-deposit-form"><div class="goal-detail-type" style="margin:-4px 0 16px;">${esc(g.name)} · ${dateLabel}</div><div class="field"><label for="goal-deposit-amount">Amount (₱)</label><input id="goal-deposit-amount" type="number" min="0.01" max="${maxAmount.toFixed(2)}" step="0.01" required value="${amount.toFixed(2)}" ${tx?'':'disabled'}></div><div class="field"><label for="goal-deposit-wallet">From wallet</label>${transactionWalletPickerHTML(state.wallets,walletId,'goal-deposit-wallet',!tx)}</div>${tx?'':'<div class="sub" style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">The original transaction for this deposit could not be found, so its amount and wallet cannot be edited.</div>'}<div class="modal-actions"><button type="button" class="btn danger" ${item||tx?'':'disabled'} onclick="clearGoalDeposit('${g.id}','${depositDate}')">Undo deposit</button><button type="submit" class="btn" ${tx?'':'disabled'}>Save changes</button></div></form>`);
  const form=document.getElementById('goal-deposit-form');
  form.onsubmit=event=>{
    event.preventDefault();
    const nextAmount=Number(document.getElementById('goal-deposit-amount').value);
    const nextWalletId=document.getElementById('goal-deposit-wallet').value;
    if(!tx||!Number.isFinite(nextAmount)||nextAmount<=0||nextAmount>maxAmount||!nextWalletId) return;
    const availableForDeposit=walletAvailableBalance(nextWalletId)+(nextWalletId===tx.walletId?amount:0);
    if(nextAmount>availableForDeposit){alert(`Not enough available in this wallet. Available for this deposit: ${fmt(availableForDeposit)}.`);return;}
    const delta=Math.round((nextAmount-amount)*100)/100;
    tx.amount=nextAmount;
    tx.walletId=nextWalletId;
    if(item){item.amount=nextAmount;item.walletId=nextWalletId;}
    g.current=Math.max(0,Math.round(((Number(g.current)||0)+delta)*100)/100);
    const monthKey=depositDate.slice(0,7);
    if(g.monthlySavedMonth===monthKey) g.monthlySavedAmount=Math.max(0,Math.round(((Number(g.monthlySavedAmount)||0)+delta)*100)/100);
    saveKey('transactions',state.transactions);
    saveKey('goals',state.goals);
    closeAllModals();render();openGoalDetails(goalId);
  };
}
window.openGoalDepositModal=openGoalDepositModal;
function clearGoalDeposit(goalId,depositDate){
  const g=state.goals.find(goal=>goal.id===goalId);
  if(!g) return;
  g.depositHistory=Array.isArray(g.depositHistory)?g.depositHistory:[];
  const historyIndex=g.depositHistory.findIndex(item=>item.date===depositDate);
  const item=historyIndex>=0?g.depositHistory[historyIndex]:null;
  const historyAmount=Number(item?.amount)||0;
  let transaction=state.transactions.find(tx=>item?.transactionId&&tx.id===item.transactionId);
  if(!transaction){
    transaction=state.transactions.find(tx=>{
      if(tx.type!=='expense'||!tx.note?.includes(`[goal:${g.id}]`)) return false;
      const scheduled=tx.note.match(/\(scheduled (\d{4}-\d{2}-\d{2})\)/)?.[1];
      return scheduled===depositDate;
    });
  }
  if(!transaction){
    transaction=state.transactions.find(tx=>tx.type==='expense'&&tx.note?.includes(`[goal:${g.id}]`)&&tx.note?.startsWith('Periodic contribution to')&&tx.date===depositDate&&Math.abs(Number(tx.amount)-historyAmount)<0.005);
  }
  if(!transaction&&historyAmount>0){
    transaction=state.transactions.filter(tx=>tx.type==='expense'&&tx.note?.includes(`[goal:${g.id}]`)&&tx.note?.startsWith('Periodic contribution to')&&Math.abs(Number(tx.amount)-historyAmount)<0.005).sort((a,b)=>Math.abs(Date.parse(`${a.date}T00:00:00`)-Date.parse(`${depositDate}T00:00:00`))-Math.abs(Date.parse(`${b.date}T00:00:00`)-Date.parse(`${depositDate}T00:00:00`)))[0];
  }
  const amount=Number(item?.amount)||Number(transaction?.amount)||0;
  if(!amount||(!item&& !transaction)) return;
  if(!confirm(`Undo the ${fmt(amount)} deposit made on ${goalDateValue(depositDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}? This will reduce the goal balance and restore the wallet balance.`)) return;
  if(transaction) state.transactions=state.transactions.filter(tx=>tx.id!==transaction.id);
  if(historyIndex>=0) g.depositHistory.splice(historyIndex,1);
  g.clearedDeposits=Array.isArray(g.clearedDeposits)?g.clearedDeposits:[];
  if(!g.clearedDeposits.some(entry=>(typeof entry==='string'?entry:entry.date)===depositDate)) g.clearedDeposits.push({date:depositDate,amount});
  g.current=Math.max(0,Math.round(((Number(g.current)||0)-amount)*100)/100);
  const monthKey=depositDate.slice(0,7);
  if(g.monthlySavedMonth===monthKey){
    g.monthlySavedAmount=Math.max(0,Math.round(((Number(g.monthlySavedAmount)||0)-amount)*100)/100);
  }else{
    delete g.monthlySavedMonth;
    delete g.monthlySavedAmount;
    const monthSaved=goalMonthSaved(g,monthKey);
    if(monthSaved>0){g.monthlySavedMonth=monthKey;g.monthlySavedAmount=monthSaved;}
  }
  g.lastContribution=[g.lastContribution||g.startDate||todayStr(),...g.depositHistory.map(entry=>entry.date),...g.clearedDeposits.map(entry=>typeof entry==='string'?entry:entry.date)].sort().at(-1);
  saveKey('transactions',state.transactions);
  saveKey('goals',state.goals);
  closeAllModals();
  render();
  openGoalDetails(goalId);
}

  window.setGoalType = function(type){

    document.getElementById('gt-periodic').className = type === 'periodic' ? 'active inc' : '';
    document.getElementById('g-targetdate').required = type === 'periodic';
    document.getElementById('g-targetdate-note').textContent = type === 'periodic' ? 'Required for periodic' : 'Optional';
    if(type==='free') document.getElementById('g-monthly-deposit').value='';
    window._goalType = type;
    window.syncGoalTargetDate();
    updatePeriodicDeposit();
  };
  window._goalType = goalType;

  window.syncGoalTargetDate = function(){
    const targetInput=document.getElementById('g-targetdate');
    const note=document.getElementById('g-targetdate-note');
    const cycleInput=document.getElementById('g-cycle');
    const startValue=document.getElementById('g-start')?.value;
    if(!targetInput||!cycleInput) return;
    const cycle=cycleInput.value;
    const days=Array.from(document.querySelectorAll('input[name="weekday"]:checked')).map(input=>input.value);
    const manualWeekly=cycle==='week'&&days.length>0;
    const automatic=window._goalType==='periodic'&&!manualWeekly;
    targetInput.readOnly=automatic;
    targetInput.dataset.datePickerLocked=String(automatic);
    updateDatePickerDisplay(targetInput);
    targetInput.required=window._goalType==='periodic';
    if(note) note.textContent=window._goalType!=='periodic'?'Optional':automatic?'Calculated from start date and cycle count':'Choose an end date for weekly deposits';
    if(!automatic||!startValue) return;
    const start=goalDateValue(startValue);
    if(!start) return;
    const count=Math.max(1,parseInt(document.getElementById('g-cycle-count')?.value,10)||1);
    const end=new Date(start);
    if(cycle==='month'){
      const calculated=addGoalMonths(start,count,start.getDate());
      targetInput.value=goalDateString(calculated);
    }else{
      end.setDate(end.getDate()+(cycle==='week'?7*count:count));
      targetInput.value=goalDateString(end);
    }
    updateDatePickerDisplay(targetInput);
  };

  window.updatePeriodicDeposit = function(){
    const type = window._goalType || 'free';
    const depositInput = document.getElementById('g-deposit');
    const estimate = document.getElementById('deposit-estimate');
    if(!depositInput || !estimate || type!=='periodic') return;
    window.syncGoalTargetDate();
    const target = Number(document.getElementById('g-target').value) || 0;
    const current = editing ? (Number(editing.current)||0) : (Number(document.getElementById('g-current')?.value)||0);
    const start = document.getElementById('g-start').value;
    const end = document.getElementById('g-targetdate').value;
    const cycle = document.getElementById('g-cycle').value;
    const cycleCount = Math.max(1,parseInt(document.getElementById('g-cycle-count').value,10)||1);
    const days = Array.from(document.querySelectorAll('input[name="weekday"]:checked')).map(input=>input.value);
    const cycleCountField=document.getElementById('cycle-count-field');
    const splitMonthly=cycle==='month'&&document.getElementById('g-split-weekly').checked;
    const weeklySelected=days.length>0&&(cycle==='week'||splitMonthly);
    if(cycleCountField) cycleCountField.style.display='block';
    document.getElementById('g-cycle-count-label').textContent=cycle==='month'?'Number of monthly cycles':cycle==='week'?'Cycle count (weeks)':'Every how many cycles?';
    document.getElementById('cycle-count-help').style.display=cycle==='week'?'block':'none';
    document.getElementById('g-deposit-label').textContent=splitMonthly?'Monthly cycle amount (₱)':weeklySelected?'Deposit each selected day (₱)':'Deposit per cycle (₱)';
    const remaining = Math.max(0,target-current);
    if(!target || !end){ depositInput.value='';document.getElementById('g-monthly-deposit').value=''; estimate.textContent='Enter a target amount and cycle count to calculate deposits.'; return; }
    if(end<=start){ depositInput.value='';document.getElementById('g-monthly-deposit').value=''; estimate.textContent='Choose a target date after the start date.'; return; }
    if((cycle==='week'||splitMonthly)&&days.length===0){ depositInput.value='';document.getElementById('g-monthly-deposit').value=''; estimate.textContent='Choose at least one deposit day.'; return; }
    if(weeklySelected){
      const months=countGoalDepositCycles(start,end,'month',1,[]);
      const existingMonthlyAmount=Number(editing?.monthlyDeposit)||(editing?.cycle==='month'?Number(editing.deposit):0);
      const startDateForEnd=goalDateValue(start);
      const automaticEndDate=startDateForEnd?goalDateString(addGoalMonths(startDateForEnd,cycleCount,startDateForEnd.getDate())):'';
      const preservePlan=editing&&existingMonthlyAmount>0&&target===Number(editing.target)&&start===editing.startDate&&cycle===(editing.cycle||'month')&&cycleCount===Number(editing.cycleCount||1)&&(end===editing.targetDate||(splitMonthly&&end===automaticEndDate));
      const monthlyAmount=preservePlan?existingMonthlyAmount:goalMonthlyBudget(target,current,start,end,1);
      const startDate=goalDateValue(start);
      const monthEnd=new Date(startDate.getFullYear(),startDate.getMonth()+1,0);
      const lastPlanDay=goalDateValue(end);lastPlanDay.setDate(lastPlanDay.getDate()-1);
      const rangeEnd=lastPlanDay<monthEnd?lastPlanDay:monthEnd;
      const firstDepositStart=new Date(startDate);firstDepositStart.setDate(firstDepositStart.getDate()+1);
      const weeks=countGoalWeekdaysInRange(goalDateString(firstDepositStart),goalDateString(rangeEnd),days,cycle==='week'?cycleCount:Infinity);
      if(!months||!weeks){depositInput.value='';document.getElementById('g-monthly-deposit').value='';estimate.textContent='No selected deposit days fit before the target date.';return;}
      const weeklyAmount=Math.ceil((monthlyAmount/weeks)*100)/100;
      depositInput.value=(splitMonthly?monthlyAmount:weeklyAmount).toFixed(2);
      document.getElementById('g-monthly-deposit').value=monthlyAmount.toFixed(2);
      estimate.textContent=`${fmt(monthlyAmount)} monthly cycle amount · ${fmt(weeklyAmount)} each selected day (${weeks} deposits in the first month).`;
      return;
    }
    document.getElementById('g-monthly-deposit').value='';
    const count = countGoalDepositCycles(start,end,cycle,cycle==='month'?1:cycleCount,days);
    if(!count){ depositInput.value=''; estimate.textContent='No deposit cycles fit before the target date.'; return; }
    if(!remaining){ depositInput.value='0.00'; estimate.textContent='Your target is already met.'; return; }
    const amount = Math.ceil((remaining/count)*100)/100;
    depositInput.value = amount.toFixed(2);
    estimate.textContent = `${count} scheduled deposit${count===1?'':'s'} · ${fmt(amount)} each to reach ${fmt(target)}.`;
  };
  window.updatePeriodicDeposit();
  ['g-target','g-start','g-targetdate','g-cycle-count','g-current'].forEach(id=>{
    document.getElementById(id)?.addEventListener('input',window.updatePeriodicDeposit);

  document.getElementById('goal-form').onsubmit = (e)=>{
    e.preventDefault();
    const name = document.getElementById('g-name').value.trim();
    const icon = GOAL_ICONS.some(item=>item[0]===document.getElementById('g-icon').value) ? document.getElementById('g-icon').value : 'home';
    const target = parseFloat(document.getElementById('g-target').value);
    const type = window._goalType || 'free';
    let deposit = parseFloat(document.getElementById('g-deposit')?.value) || 0;
    const cycle = document.getElementById('g-cycle')?.value || 'month';
    const weekDays = Array.from(document.querySelectorAll('input[name="weekday"]:checked')).map(cb => cb.value);
    const splitWeekly=cycle==='month'&&Boolean(document.getElementById('g-split-weekly')?.checked);
    const cycleCount = Math.max(1,parseInt(document.getElementById('g-cycle-count')?.value,10)||1);
    const monthlyDeposit = parseFloat(document.getElementById('g-monthly-deposit')?.value)||0;
    const startDate = document.getElementById('g-start').value || todayStr();
    const targetDate = document.getElementById('g-targetdate').value || '';
    // Get selected week days
    const current = editing ? (Number(editing.current)||0) : (parseFloat(document.getElementById('g-current')?.value)||0);
    if(!name || !target || target<=0){ alert('Enter a name and valid target amount.'); return; }
    if(type === 'periodic' && !targetDate){ alert('Choose a target date to calculate your periodic deposit.'); return; }
    if(type === 'periodic' && targetDate<=startDate){ alert('Choose a target date after the start date.'); return; }
    if(type === 'periodic' && (cycle === 'week'||splitWeekly) && weekDays.length === 0){ alert('Please select at least one day of the week for weekly savings.'); return; }
    if(type === 'periodic'){
      const count = countGoalDepositCycles(startDate,targetDate,cycle,cycle==='month'?1:cycleCount,weekDays);
      if(!count && current<target){ alert('There are no scheduled deposits before the target date. Choose a later target date.'); return; }
      if(cycle==='week'&&weekDays.length){
        const start=goalDateValue(startDate);
        const firstMonthEnd=new Date(start.getFullYear(),start.getMonth()+1,0);
        const end=goalDateValue(targetDate);end.setDate(end.getDate()-1);
        const firstRangeEnd=end<firstMonthEnd?end:firstMonthEnd;
        const firstDepositStart=new Date(start);firstDepositStart.setDate(firstDepositStart.getDate()+1);
        const firstMonthCycles=countGoalWeekdaysInRange(goalDateString(firstDepositStart),goalDateString(firstRangeEnd),weekDays,cycleCount,startDate);
        if(!firstMonthCycles && current<target){alert('No selected deposit days fit in the first month. Choose a later target date.');return;}
        deposit=current>=target?0:Math.min(Math.ceil((monthlyDeposit/firstMonthCycles)*100)/100,Math.max(0,target-current));
      } else {
        deposit = current>=target ? 0 : Math.ceil(((target-current)/count)*100)/100;
      }
    }
    
    if(splitWeekly&&type==='periodic') deposit=current>=target?0:monthlyDeposit;
    if(editing){
      Object.assign(editing, {name, icon, target, type, deposit, monthlyDeposit, cycle, cycleCount, startDate, targetDate, weekDays, splitWeekly});
    } else {
      state.goals.push({id:uid(), name, icon, target, type, deposit, monthlyDeposit, cycle, cycleCount, startDate, targetDate, weekDays, splitWeekly, current, lastContribution:startDate});
    }
    saveKey('goals', state.goals);
    closeModal(); render();
  };
}

function openContributeModal(goalId,scheduledDateOverride='',scheduledAmountOverride=0){
  const g = state.goals.find(x=>x.id===goalId);
  if(!g) return;
  const remaining = Math.max(0,Math.round((Number(g.target)-Number(g.current))*100)/100);
  const weeklySelected=g.type==='periodic'&&goalUsesWeeklyDeposits(g);
  const plannedDate=weeklySelected?(scheduledDateOverride||nextGoalManualDueDate(g)):todayStr();
  const periodicDeposit = weeklySelected?(Number(scheduledAmountOverride)||goalWeeklyInstallment(g,plannedDate)):(Number(g.deposit)||0);
  const periodicLocked = g.type==='periodic' && periodicDeposit>0;
  const suggestedAmount = periodicLocked ? Math.min(periodicDeposit,remaining).toFixed(2) : '';
  openModal(`
    <div class="modal-head"><h3>Add funds to “${esc(g.name)}”</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form id="contrib-form">
      <div class="field"><label>${periodicLocked?'Scheduled deposit (₱)':'Amount (₱)'}</label><input type="number" step="0.01" min="0.01" max="${remaining.toFixed(2)}" id="c-amount" required value="${suggestedAmount}" ${periodicLocked?'readonly':''} placeholder="0.00"></div>
      <div class="field"><label>From wallet</label>${transactionWalletPickerHTML(state.wallets.filter(w=>!isAtomeWallet(w)),state.wallets.find(w=>!isAtomeWallet(w))?.id,'c-wallet')}</div>
      <div class="sub" style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">${periodicLocked?(weeklySelected?`Planned for ${goalDateValue(plannedDate).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}: ${fmt(periodicDeposit)}. Your monthly savings target is ${fmt(goalWeeklyMonthlyTarget(g))}.`:`Your scheduled amount is ${fmt(periodicDeposit)} per cycle.`)+` This adds ${fmt(Math.min(periodicDeposit,remaining))}; the final contribution is capped at the remaining goal balance.`:'This records an expense and adds it to your goal.'}</div>
      <div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Add funds</button></div>
    </form>
  `);
  document.getElementById('contrib-form').onsubmit = (e)=>{
    e.preventDefault();
    const enteredAmount = parseFloat(document.getElementById('c-amount').value);
    const amount = periodicLocked ? Math.min(periodicDeposit,remaining) : enteredAmount;
    const walletId = document.getElementById('c-wallet').value;
    if(!amount||amount<=0){ alert('This goal has no remaining balance.'); return; }
    const available=walletAvailableBalance(walletId);
    if(amount>available){alert(`Not enough available in this wallet. Available: ${fmt(available)}.`);return;}
    let goalCat = state.categories.find(c=>c.id==='c-savings');
    if(!goalCat){ goalCat = {id:'c-savings', name:'Savings Goal', type:'expense', color:'#C9A227'}; state.categories.push(goalCat); saveKey('categories', state.categories); }
    const contributionDate=weeklySelected?plannedDate:todayStr();
    const contributionTx={id:uid(), amount, walletId, categoryId:goalCat.id, date:todayStr(), note:`Contribution to: ${g.name} [goal:${g.id}]${weeklySelected?` (scheduled ${plannedDate})`:''}`, type:'expense'};
    state.transactions.push(contributionTx);
    g.current = Math.round((g.current + amount) * 100) / 100;
    if(weeklySelected) addGoalMonthSaved(g,contributionDate.slice(0,7),amount);
    g.lastContribution = contributionDate;
    if(weeklySelected){
      g.depositHistory=Array.isArray(g.depositHistory)?g.depositHistory:[];
      g.depositHistory.push({date:contributionDate,amount,transactionId:contributionTx.id,walletId});
    }
    saveKey('transactions', state.transactions);
    saveKey('goals', state.goals);
    if(scheduledDateOverride) closeAllModals();
    else closeModal();
    render();
  };
}
window.openContributeModal = openContributeModal;

/* --- Category modal --- */
function openCategoryModal(id){
  const editing = id ? state.categories.find(c=>c.id===id) : null;
  window._catType = editing?editing.type:'expense';
  window._catPickedIcon = categoryIconKey(editing);
  openModal(categoryModalMarkup(window._catType,editing));
  document.querySelectorAll('.overlay').item(document.querySelectorAll('.overlay').length-1)?.querySelector('.modal')?.classList.add('category-modal');
  bindCatForm(editing);
}
function categoryModalMarkup(type,editing){
  const selectedIcon=window._catPickedIcon||'tag';
  const action=editing?'Save category':'Add category';
  return `
    <div class="modal-head"><h3>${editing?'Edit':'Add'} category</h3><button type="button" class="modal-close" aria-label="Close category dialog" onclick="closeModal()">&times;</button></div>
    <p class="category-modal-intro">Give this category a clear name and an icon that’s easy to recognize.</p>
    <form id="cat-form">
      <div class="category-modal-fields">
        <div class="field"><label>Category type</label><div class="type-toggle"><button type="button" class="${type==='expense'?'active exp':''}" aria-pressed="${type==='expense'}" onclick="catSwitchType('expense', ${editing?`'${editing.id}'`:'null'})">Expense</button><button type="button" class="${type==='income'?'active inc':''}" aria-pressed="${type==='income'}" onclick="catSwitchType('income', ${editing?`'${editing.id}'`:'null'})">Income</button></div></div>
        <div class="field"><label for="cat-name">Category name</label><input type="text" id="cat-name" required maxlength="24" value="${editing?esc(editing.name):''}" oninput="updateCategoryPreview()" placeholder="e.g. Groceries"></div>
        <div class="field"><label>Category icon</label><button type="button" id="category-icon-trigger" class="category-icon-trigger" aria-label="Choose category icon" onclick="openCategoryIconModal()"><span id="category-preview-icon" class="category-preview-icon">${categoryIconSvg(selectedIcon)}</span><span class="category-icon-trigger-copy"><span id="category-preview-name" class="category-icon-trigger-title">${editing?esc(editing.name):'New category'}</span><span id="category-preview-icon-name" class="category-icon-trigger-note">${esc(CATEGORY_ICON_DEFS[selectedIcon]?.[0]||'Tag')} · Tap to change</span></span><svg class="category-icon-trigger-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
      </div>
      <div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn">${action}</button></div>
    </form>`;
}
function catSwitchType(t, editingId){
  window._catType = t;
  const editing = editingId ? state.categories.find(c=>c.id===editingId) : null;
  const modal = document.querySelector('.modal');
  modal.innerHTML = categoryModalMarkup(t,editing);
  bindCatForm(editing);
}
function selectCategoryIcon(button,key){
  window._catPickedIcon=key;
  closeModal();
  const preview=document.getElementById('category-preview-icon');
  if(preview) preview.innerHTML=categoryIconSvg(key);
  const iconName=document.getElementById('category-preview-icon-name');
  if(iconName) iconName.textContent=`${CATEGORY_ICON_DEFS[key]?.[0]||'Tag'} · Tap to change`;
  document.getElementById('category-icon-trigger')?.focus({preventScroll:true});
}
function openCategoryIconModal(){
  const selectedIcon=window._catPickedIcon||'tag';
  const options=Object.entries(CATEGORY_ICON_DEFS).map(([key,[label]])=>`<button type="button" class="category-icon-option ${selectedIcon===key?'selected':''}" data-search="${esc((key+' '+label).toLowerCase())}" aria-label="${label} icon" title="${label}" aria-pressed="${selectedIcon===key}" onclick="selectCategoryIcon(this,'${key}')">${categoryIconSvg(key)}</button>`).join('');
  openModal(`<div class="modal-head"><h3>Choose an icon</h3><button type="button" class="modal-close" aria-label="Close icon picker" onclick="closeModal()">&times;</button></div><div class="category-icon-modal-intro">Pick a symbol that makes this category easy to spot. <strong>${Object.keys(CATEGORY_ICON_DEFS).length} icons</strong></div><input class="category-icon-search" type="search" placeholder="Search by name or type" aria-label="Search category icons" oninput="filterCategoryIcons(this.value)"><div class="category-icon-grid">${options}<div class="category-icon-no-results" hidden>No matching icons. Try another search.</div></div><div class="category-icon-modal-footer">Select an icon to apply it to your category.</div>`);
  document.querySelectorAll('.overlay').item(document.querySelectorAll('.overlay').length-1)?.querySelector('.modal')?.classList.add('category-icon-modal');
}
function filterCategoryIcons(query){
  const normalized=String(query||'').trim().toLowerCase();
  const options=[...document.querySelectorAll('.category-icon-option')];
  let visible=0;
  options.forEach(option=>{
    const show=!normalized||option.dataset.search.includes(normalized);
    option.hidden=!show;
    if(show) visible++;
  });
  const empty=document.querySelector('.category-icon-no-results');
  if(empty) empty.hidden=visible>0;
}
function updateCategoryPreview(){
  const input=document.getElementById('cat-name');
  const name=document.getElementById('category-preview-name');
  if(name) name.textContent=input?.value.trim()||'New category';
}
function bindCatForm(editing){
  document.getElementById('cat-form').onsubmit = (e)=>{
    e.preventDefault();
    const name = document.getElementById('cat-name').value.trim();
    if(!name){ alert('Enter a category name.'); return; }
    if(editing){ Object.assign(editing, {name, type:window._catType, icon:window._catPickedIcon||'tag'}); }
    else{ state.categories.push({id:uid(), name, type:window._catType, icon:window._catPickedIcon||'tag', color:CAT_COLORS[state.categories.length % CAT_COLORS.length]}); }
    saveKey('categories', state.categories);
    closeModal(); render();
  };
}
window.openCategoryModal = openCategoryModal;
window.catSwitchType = catSwitchType;
window.selectCategoryIcon = selectCategoryIcon;
window.openCategoryIconModal = openCategoryIconModal;
window.updateCategoryPreview = updateCategoryPreview;
window.filterCategoryIcons = filterCategoryIcons;

/* ---------------- Utils ---------------- */
function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// Restore appearance preferences and any existing server session.
applyTheme(state.theme);
if(authToken){
  api('/auth/me').then(async result=>{
    state.user = result.username;
    await loadUserData();
    state.loaded = true;
    render();
    startRealtimeSync();
  }).catch(()=>{ sessionStorage.removeItem('ledger_token'); localStorage.removeItem('ledger_remember_token'); authToken=null; render(); });
}else render();
</script>
</body>
</html>
